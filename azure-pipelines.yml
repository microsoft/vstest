# Public PR build for rel/17.3.
# The official (internal) build is azure-pipelines-official.yml. It triggers only on internal/rel/*.
# This pipeline runs only on PRs. An explicit `trigger: none` avoids duplicate builds
# (one for the push, one for the PR).
trigger: none

pr:
  branches:
    include:
    - main
    - rel/*
  paths:
    exclude:
    - .github/*
    - docs/*
    - README.md
    - azure-pipelines-official.yml

jobs:
- job: Windows
  timeoutInMinutes: 120
  pool:
    vmImage: 'windows-latest'
  variables:
    buildConfiguration: 'Release'
  steps:
  - checkout: self
    fetchDepth: 1
    clean: true

  # -warnAsError 0 because this branch compiles 2022 source with a current Roslyn.
  - powershell: eng\build.ps1
      -configuration $(buildConfiguration)
      -restore
      -build
      -ci
      -prepareMachine
      -warnAsError 0
      -projects $(Build.SourcesDirectory)\TestPlatform.sln
    displayName: 'Build'

  - powershell: eng\build.ps1
      -configuration $(buildConfiguration)
      -test
      -ci
      -warnAsError 0
      -projects $(Build.SourcesDirectory)\TestPlatform.sln
    displayName: 'Run Unit Tests'
    env:
      DOTNET_ROOT: $(Build.SourcesDirectory)\.dotnet

  - task: PublishTestResults@2
    displayName: 'Publish Test Results **\*.trx'
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: '**\*.trx'
    condition: succeededOrFailed()

  - task: PublishPipelineArtifact@1
    displayName: 'Publish logs'
    inputs:
      targetPath: '$(Build.SourcesDirectory)\artifacts\log'
      artifact: 'logs_$(Agent.JobName)'
      publishLocation: 'pipeline'
    condition: succeededOrFailed()
