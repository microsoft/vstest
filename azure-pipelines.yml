# Public pull request build for rel/16.11.
# The branch-push trigger is off, so only pull requests build. An explicit `trigger: none`
# avoids a second build for the push of a non-fork pull request.
trigger: none

pr:
  branches:
    include:
    - rel/16.11
  paths:
    exclude:
      - .github/*
      - '**/*.md'
      - azure-pipelines-official.yml

jobs:
- job: Windows
  timeoutInMinutes: 120
  pool:
    name: NetCore-Public
    demands: ImageOverride -equals windows.vs2022.amd64.open
  variables:
    _BuildConfig: Release
  steps:
  - powershell: eng\build.ps1
      -configuration $(_BuildConfig)
      -restore
      -build
      -ci
      -prepareMachine
      -warnAsError 0
      -projects $(Build.SourcesDirectory)\TestPlatform.sln
    displayName: Build

  # The test assets' NuGet.config names this local feed, and nothing else in this pipeline creates it.
  - powershell: New-Item -ItemType Directory -Force -Path "$(Build.SourcesDirectory)\artifacts\testArtifacts\packages" | Out-Null
    displayName: Create local test feed directory

  # Test assets are built best-effort, as in the official pipeline. Some net4x assets cannot
  # build on the agent image. Unit tests that need them are listed in the known failures file.
  - powershell: .dotnet\dotnet.exe build
      $(Build.SourcesDirectory)\test\TestAssets\CILProject\CILProject.proj
      --configuration $(_BuildConfig)
      -v:minimal
    displayName: Build test assets (CILProject)
    continueOnError: true

  - powershell: .dotnet\dotnet.exe build
      $(Build.SourcesDirectory)\test\TestAssets\TestAssets.sln
      --configuration $(_BuildConfig)
      -v:minimal
      /p:VsTestTestAssetsBuild=true
      /p:RestoreAdditionalProjectSources=$(Build.SourcesDirectory)\packages
    displayName: Build test assets
    continueOnError: true
    env:
      NUGET_PACKAGES: $(Build.SourcesDirectory)\.packages

  - powershell: eng\build.ps1
      -configuration $(_BuildConfig)
      -test
      -ci
      -prepareMachine
      -warnAsError 0
      -projects $(Build.SourcesDirectory)\TestPlatform.sln
    displayName: Test
    continueOnError: true

  # Fails on any test result that is not in the known failures file.
  - powershell: |
      ./eng/Assert-KnownTestFailures.ps1 `
        -ResultsDirectory "$(Build.SourcesDirectory)\artifacts\TestResults\$(_BuildConfig)" `
        -BaselinePath "$(Build.SourcesDirectory)/eng/servicing-known-test-failures.json" `
        -ExpectedProductVersionPrefix "16.11."
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    displayName: Gate on unclassified test results
    condition: succeededOrFailed()

  - task: PublishBuildArtifacts@1
    displayName: Publish logs
    inputs:
      PathtoPublish: $(Build.SourcesDirectory)\artifacts\log
      ArtifactName: Logs
    condition: always()
    continueOnError: true
