            - powershell: .dotnet\dotnet.exe build
                $(Build.SourcesDirectory)\test\TestAssets\CILProject\CILProject.proj
                --configuration $(_BuildConfig)
                -v:minimal
              name: BuildTestAssetsCIL
              displayName: Build test assets (CILProject)
              continueOnError: true

            # NON-BLOCKING ON PURPOSE, and this is the second time the same measurement has
            # forced the same conclusion. Build 3063958 failed here with MSB3644 x80:
            #
            #   MSB3644: The reference assemblies for .NETFramework,Version=v4.5.1 were not found
            #
            # plus net452 and net461, with CS0518 x592 and CS0246 x240 downstream of them - no
            # reference assemblies means no System.Object. The CILProject failure above was not a
            # special case, it was the FIRST INSTANCE of a general condition: the test assets carry
            # 53 net4x projects across 9 target frameworks and this agent image has reference
            # assemblies for none of the old ones.
            #
            # The standard remedy is a Microsoft.NETFramework.ReferenceAssemblies PackageReference,
            # and it is NOT AVAILABLE HERE. It has to be scoped to the test assets, and the only
            # Directory.Build.props that applies to test\TestAssets is the REPO ROOT one - this
