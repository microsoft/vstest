            #
            # So the step builds what the agent can build and does not block. The reasoning is the
            # one this line already applied to CILProject: a fix whose failure mode is worse than
            # the defect it addresses is not a fix.
            #
            #   without this step   4,802 tests EXECUTED, 6 asset failures, the gate fires
            #   blocking            0 tests executed, the whole leg skipped - twice, 3063930 and 3063958
            #
            # continueOnError renders the step as "succeeded with issues", which on this project is
            # exactly the shape that has to be distrusted - a failure wearing a success colour. It
            # is tolerable here only because the step is FOLLOWED BY A MEASUREMENT of what was
            # actually produced, and because the control that matters is unaffected: the TEST result
            # still gates Sign. A test asset failing to build must not block signing the product;
            # a test failing must, and still does.

            # DIAGNOSTIC, added 2026-09-04 because CI and a local repro DISAGREE.
            #
            # Locally, on the pinned SDK from global.json, with the exact same command line:
            #   MSB3644                                   0   (CI: 16)
            #   PlatformAbstractions netstandard2.0 errors 0   (CI: 838)
            # and the gated PackageReference demonstrably reaches the src projects - the generated
            # src\Microsoft.TestPlatform.CoreUtilities\obj\*.nuget.g.targets imports the net45,
            # net451 and net461 reference-assembly targets. The local v4.5.1 targeting pack is NOT
            # masking it either: that directory exists but contains ZERO mscorlib.dll.
            #
            # So the props change is correct and something about the AGENT differs. Candidates worth
            # separating, all of which fail SILENTLY because the generated imports are guarded by
            # Exists(): the package is absent from the agent's NuGet cache under network isolation,
            # or restore no-ops against an obj\ left by the earlier Arcade Build step, or the two
            # steps use different NUGET_PACKAGES roots (the Arcade step runs -ci and this one does
            # not).
            #
            # A binlog answers all of them at once and costs one build. -v:normal alone does not:
            # the question is which imports were evaluated, not which tasks ran.
            #
            # CUITTestProject is back in TestAssets.sln for normal acceptance coverage. Its pinned
            # dependencies now resolve from the additive local packages source below, populated by
            # Package. This preserves the isolated build cache and does not add a feed.
            #
            # This pipeline runs UNIT tests only - the Test step's own comment records that
            # Acceptance, Smoke, Performance and the *PlatformTests are deliberately not in it - so
            # CUITTest cannot be affected by this here. Restoring the project to the solution is a
            # one-line revert once the Coded UI packages exist on a configured feed.
            #
            # ---------------------------------------------------------------------------------
            # 🛑 THAT PREDICTION FAILED, AND THE GAP IS THE FINDING. MEASURED on 3066739: 32 -> 16,
            # not 32 -> 0. Recorded as WRONG rather than restated, because the shortfall located the
            # rest of the defect. Decomposed BOTH builds the same way, by project:
            #
            #                                   3066640   3066739
            #   CUITTestProject                     16         0    <- the solution-membership change
            #   LegacySettingsUnitTestProject        8         8    } untouched, and never CUIT's
            #   MstestV1UnitTestProject              8         8    } to remove
            #                                       --        --
            #                                       32        16
            #
            # So dropping CUITTestProject removed EXACTLY its own 16 and nothing else. The change did
            # what it mechanically could; the error was in the ATTRIBUTION - all 32 were booked to one
            # project when only half of them were its.
            #
            # The remaining 16 are ONE package, Microsoft.VisualStudio.QualityTools, in TWO projects
            # that are not Coded UI at all and must NOT be dropped: they are real MSTest v1 / legacy
            # runsettings assets.
            #
            # WHY RESTORE CANNOT SEE IT, measured in two files rather than inferred:
            #   test\TestAssets\NuGet.config   <clear /> then THREE sources:
            #                                    locally-built-testplatform-packages, test-tools,
            #                                    dotnet-public
            #   NuGet.config (repo root)       ELEVEN sources, including vs-impl / vs-impl-archived /
            #                                    vssdk / vssdk-archived
            # The pinned 16.11.31528.385 is on none of the three, which is exactly what NU1102 prints.
            # It is not on "no feed" as the note above guessed - src\package\external\external.csproj
            # takes the SAME package at the SAME $(TestPlatformExternalsVersion) and restores it fine,
            # because the product path reads the eleven-source root config.
            #
            # So the package IS on the agent, in the no-dot packages\ folder, before this step runs.
            # Two independent proofs, neither of which needs a new build:
            #   1. these projects compiled in every earlier build, and their <Reference> HintPath is
            #      literally ..\..\..\packages\microsoft.visualstudio.qualitytools\$(TestPlatform-
            #      ExternalsVersion)\tools\net451\ - the no-dot folder, so it must be populated
            #   2. before the NUGET_PACKAGES change this step's global folder WAS that folder, and it
            #      reported zero NuGet errors while seeing the same three feeds
            #
            # THE FIX IS THEREFORE NOT A FEED AND NOT A DROP. The folder is added back as a local
            # restore SOURCE, so the already-present package is found, while compilation keeps using
            # .packages and the 822 errors that root removed stay removed. RestoreAdditionalProject-
            # Sources is ADDITIVE, so it survives the <clear /> that the three-source config applies;
            # a fallbackPackageFolders edit would not, and would also hard-error if the folder were
            # ever absent. Nothing public is involved: this is a directory on the agent, read-only, at
            # a path this same step already probes.
            #
            # 🛑 VERIFY BY THE NUMBER on the next build: NU1102 16 -> 0, and the per-project split
            # above must go 8 -> 0 for BOTH projects. If it stays at 16 the source was not honoured
            # and the change is inert - do not re-explain it, measure where restore looked.
            - powershell: .dotnet\dotnet.exe build
                $(Build.SourcesDirectory)\test\TestAssets\TestAssets.sln
                --configuration $(_BuildConfig)
                -v:minimal
                /p:VsTestTestAssetsBuild=true
                /p:RestoreAdditionalProjectSources=$(Build.SourcesDirectory)\packages
                -bl:$(Build.SourcesDirectory)\artifacts\log\$(_BuildConfig)\TestAssets.binlog
              name: BuildTestAssets
              displayName: Build test assets
              continueOnError: true
              env:
                # THE TWO STEPS DISAGREED ABOUT WHERE PACKAGES LIVE. Measured on 3066591's binlog:
                #
                #   TargetFrameworkRootPath  D:\a\_work\1\s\packages\microsoft.netframework.referenceassemblies.net451\1.0.3\build\
                #   package found by probe   D:\a\_work\1\s\.packages\microsoft.netframework.referenceassemblies.net451\1.0.3\build
                #                                         ^ one leading dot
                #
                # Cause, in two files:
                #   NuGet.config             globalPackagesFolder = "packages"   RELATIVE -> <repo>\packages
                #   eng\common\tools.ps1:645 NUGET_PACKAGES = <RepoRoot>\.packages\
                #
                # The Build step runs eng\common\build.ps1, which runs tools.ps1, so it restores into
                # .packages. THIS step invokes .dotnet\dotnet.exe directly, so tools.ps1 never runs -
                # the probe on 3066591 printed NUGET_PACKAGES = '' - and NuGet falls back to
                # NuGet.config's relative globalPackagesFolder, the no-dot folder.
                #
                # Everything downstream then fails SILENTLY: the generated imports are guarded by
                # Exists(), and a missing targeting-pack root is MSB3644, not a NuGet error. That is
                # how four builds running three different props changes produced byte-identical
                # counts.
                #
                # Setting it here aligns this step with the Build step instead of editing
                # NuGet.config, which restore, the Arcade build and the packaging step all read.
                NUGET_PACKAGES: $(Build.SourcesDirectory)\.packages\

            # Reports only. Never gates - it runs after a step that is allowed to fail, and its
            # whole purpose is to explain that failure, so it must not become a second failure.
            # The 15.9 line already had a "diagnostic" that returned exit 1 and coloured every
            # build; do not repeat that here.
            - powershell: |
                $ErrorActionPreference = 'Continue'
                Write-Host "NUGET_PACKAGES = '$env:NUGET_PACKAGES'"
                foreach ($root in @($env:NUGET_PACKAGES, "$env:USERPROFILE\.nuget\packages", "$(Build.SourcesDirectory)\.packages", "$(Build.SourcesDirectory)\packages")) {
                    if (-not $root) { continue }
                    $p = Join-Path $root 'microsoft.netframework.referenceassemblies.net451\1.0.3\build'
                    Write-Host ("{0,-5} {1}" -f (Test-Path $p), $p)
                    # The .NETFramework payload is the thing MSB3644 is actually looking for. A
                    # present package folder with no v4.5.1 payload looks identical to a working one
                    # unless this is checked.
                    $fw = Join-Path $p '.NETFramework\v4.5.1\mscorlib.dll'
                    Write-Host ("      mscorlib v4.5.1 present: {0}" -f (Test-Path $fw))
                }
                $g = "$(Build.SourcesDirectory)\src\Microsoft.TestPlatform.CoreUtilities\obj"
                Get-ChildItem $g -Filter '*.nuget.g.targets' -ErrorAction SilentlyContinue | ForEach-Object {
                    Write-Host "--- $($_.FullName) ---"
                    $hits = Select-String -Path $_.FullName -Pattern 'ReferenceAssemblies'
                    if ($hits) { $hits.Line } else { Write-Host 'NO ReferenceAssemblies import - the gated PackageReference did not reach this project' }
                }
                exit 0
              displayName: Diagnose reference-assembly restore
              condition: succeededOrFailed()
              # WHAT TODAY'S ORANGE CONSISTS OF, so a future worse orange is distinguishable from it.
              # As of build 3064130 this step is succeededWithIssues for exactly one reason: MSB3644
              # for .NETFramework v4.5.1 on PRODUCT projects reached as ProjectReferences from
              # TestAssets.sln, which does not go through Arcade's entry point. The count was 80
              # before the test assets were given the per-TFM reference-assembly package and 16 after,
              # and all 16 were product projects. Nothing else is expected here.
              #
              # This step's failure is NOT covered by any downstream control - the gate reads test
              # results, not asset build output - so if the count moves, nothing will say so on its
              # own. Compare against 16 before concluding that an orange here is the same orange.

            # What the previous step actually produced, reported rather than assumed. This exists
            # because "succeeded with issues" carries no information about WHICH assets built, and
            # the asset-attributed test failures are tied to specific projects.
            #
            # IT REPORTS BOTH LAYOUTS ON PURPOSE. The first version of this step searched only
            # test\TestAssets\*\bin, the historic convention, and printed "Test asset outputs
            # produced: 0" on build 3063977 while the build had in fact produced 48 outputs under
            # artifacts\bin. It named SimpleTestProject and MSTestAdapterPerfTestProject as NONE
            # when both had built. A query that matched nothing returned a confident, plausible,
            # wrong answer, in the one step added specifically to replace assumption with
            # measurement - and it was written against the historic layout one commit after a commit
            # message about that exact layout change.
            #
            # So it now searches BOTH, prints the path it searched next to every count, and says so
            # when a population is empty. outputs=0 must never again be indistinguishable from "I
            # looked in the wrong place". The gap between the two layouts is not noise here: it is
            # the cause of the remaining asset-path test failures, because the build writes to
            # artifacts\bin and IntegrationTestEnvironment.GetTestAsset composes the historic path.
            #
            # continueOnError because a step whose only job is to describe what happened must never
            # be able to stop it. Without it this step gates Test and Sign through succeeded().
            - pwsh: |
                $layouts = [ordered]@{
                  'arcade   artifacts\bin'      = "$(Build.SourcesDirectory)\artifacts\bin"
                  'historic test\TestAssets'    = "$(Build.SourcesDirectory)\test\TestAssets"
                }
                $found = @{}
                foreach ($name in $layouts.Keys) {
                  $root = $layouts[$name]
                  if (-not (Test-Path $root)) {
                    Write-Host "$name -> $root : ROOT DOES NOT EXIST"
                    $found[$name] = @()
                    continue
                  }
                  $items = @(Get-ChildItem $root -Recurse -Include *.dll,*.exe -File -ErrorAction SilentlyContinue)
                  if ($name -like 'historic*') { $items = @($items | Where-Object { $_.FullName -match '\\bin\\' }) }
                  $found[$name] = $items
                  Write-Host "$name -> $root : $($items.Count) outputs"
                  if ($items.Count -eq 0) { Write-Host "  EMPTY - this is a statement about this path only, not about the build" }
                }
                Write-Host ""
                Write-Host "Projects tied to the asset-attributed test failures:"
                foreach ($p in 'SimpleTestProject','MSTestAdapterPerfTestProject','CILProject') {
                  foreach ($name in $layouts.Keys) {
                    $hits = @($found[$name] | Where-Object { $_.FullName -match [regex]::Escape("\$p\") })
                    Write-Host ("  {0,-30} {1,-28} outputs={2}" -f $p, $name, $hits.Count)
                  }
                }
              name: ReportTestAssets
              displayName: Report which test assets were produced
              condition: succeededOrFailed()
              continueOnError: true

            # WHY THE net451 ASSETS DO NOT BUILD - an ISOLATED probe, not a probe of this repo.
            #
            # Three hypotheses are already dead by measurement on this agent: the package being
            # unavailable (it is in the restore graph), the IncludeAssets="build" restriction
            # (removing it changed nothing and resolved FEWER sub-packages), and
            # scripts\build\TestAssets.props (it sets one unrelated boolean).
            #
            # The remaining question is not about a property value - that has answered "empty" three
            # times without saying why - it is about an IMPORT: does the reference-assemblies
            # package's build\*.targets get imported at all? So this builds a self-contained project
            # in a temp directory that references the package and nothing else, and reports the
            # import closure via -preprocess. Isolated on purpose: no repo props, no Arcade, no
            # solution, so an answer here is about the PACKAGE and the AGENT rather than about this
            # repository's configuration.
            #
            # This cannot be measured on a developer box. The condition under investigation is the
            # ABSENCE of the reference assemblies, and every developer machine here has targeting
            # packs from v4.0 to v4.8.1 installed, so MSB3644 never fires there in the first place.
            # A remedy cannot be tested against a failure that will not reproduce.
            #
            # Reports only, and never gates the build it is diagnosing.
            - pwsh: |
                $probe = Join-Path $env:AGENT_TEMPDIRECTORY 'net451probe'
                Remove-Item $probe -Recurse -Force -ErrorAction SilentlyContinue
                New-Item -ItemType Directory -Force $probe | Out-Null
                $csproj = @(
                  '<Project Sdk="Microsoft.NET.Sdk">',
                  '  <PropertyGroup>',
                  '    <TargetFramework>net451</TargetFramework>',
                  '    <AssemblyName>Net451Probe</AssemblyName>',
                  '  </PropertyGroup>',
                  '  <ItemGroup>',
                  '    <PackageReference Include="Microsoft.NETFramework.ReferenceAssemblies" Version="1.0.3" PrivateAssets="all" />',
                  '  </ItemGroup>',
                  '</Project>') -join [Environment]::NewLine
                Set-Content -Path (Join-Path $probe 'Net451Probe.csproj') -Value $csproj -Encoding UTF8
                'namespace P { public class C { } }' | Set-Content (Join-Path $probe 'C.cs') -Encoding UTF8
                $dotnet = "$(Build.SourcesDirectory)\.dotnet\dotnet.exe"
                Push-Location $probe
                Write-Host "--- restore ---"
                & $dotnet restore 2>&1 | Select-Object -Last 6 | ForEach-Object { Write-Host "  $_" }
                Write-Host "--- TargetFrameworkRootPath in the ISOLATED probe ---"
                $v = & $dotnet msbuild Net451Probe.csproj -getProperty:TargetFrameworkRootPath -v:quiet --nologo 2>&1
                Write-Host "  '$(($v | Where-Object { $_ -and "$_".Trim() } | Select-Object -Last 1))'"
                Write-Host "--- IMPORT CLOSURE: is the package's targets file imported? ---"
                & $dotnet msbuild Net451Probe.csproj -preprocess:pp.xml -v:quiet --nologo 2>&1 | Out-Null
                if (Test-Path pp.xml) {
                  $hits = @(Select-String -Path pp.xml -Pattern 'ReferenceAssemblies' | Select-Object -First 8)
                  Write-Host "  lines mentioning ReferenceAssemblies: $((Select-String -Path pp.xml -Pattern 'ReferenceAssemblies').Count)"
                  $hits | ForEach-Object { Write-Host "    $($_.Line.Trim())" }
                  Write-Host "  nuget.g.props/targets imported: $((Select-String -Path pp.xml -Pattern 'nuget\.g\.(props|targets)').Count)"
                } else { Write-Host "  PREPROCESS PRODUCED NO FILE - the probe itself failed, treat that as the finding" }
                Write-Host "--- does the probe COMPILE? that is the real question ---"
                $o = & $dotnet build -v:minimal --nologo 2>&1
                Write-Host "  exit=$LASTEXITCODE  MSB3644=$(@($o | Select-String 'MSB3644').Count)"
                $o | Select-String -Pattern 'error|-> ' | Select-Object -First 4 | ForEach-Object { Write-Host "  $_" }
                Pop-Location
                # EXIT 0 DELIBERATELY. This step's own header says it "reports only, and never gates
                # the build it is diagnosing" - and until now that was false. The probe restores from
                # api.nuget.org, which network isolation BLOCKS on this agent, so it exits 1 on every
                # run with NU1301 and renders the step succeededWithIssues. Measured on 3065423: the
                # probe contributed one of the three orange steps while answering nothing, because a
                # probe that cannot restore cannot report on reference assemblies either.
                #
                # The diagnostic output above is still printed and still worth reading. What is
                # removed is its effect on the build result, which it was never supposed to have.
                # DO NOT "fix" this by pointing the probe at the repo NuGet.config: the probe is
                # deliberately isolated from repo configuration, and giving it the repo's feeds would
                # change what it measures.
                exit 0
              name: DiagnoseNet451
              displayName: Diagnose net451 reference assemblies on the agent
              condition: succeededOrFailed()
              continueOnError: true
            # THE TEST LEG. Placed AFTER Package and BEFORE Sign, and the ordering is the whole
            # point rather than a preference.
            #
            # WHY PACKAGING MUST COME FIRST. IntegrationTestEnvironment.PublishDirectory resolves
            # artifacts\<config>\<framework>\<runtime> and THROWS if it does not exist. That
            # directory is produced by Publish-Package, not by the build:
            #
            #   retained null-build reference set (restore+build only)  artifacts\Release\net451\win7-x64  ABSENT
            #   after packaging                                          same path                          228 files
            #
            # On this line the property is UNCONDITIONAL - one path, no runningInCli branch - so
            # every acceptance, smoke, platform and performance test touches it. And the failure
            # would not present as "console missing": vstest.console.exe IS in the build-output
            # tree, while Extensions\ (168 files, the adapter payload GetTestAdapterPath resolves)
            # is absent from it entirely. The message would be adapter-not-found, and the message
            # the harness actually prints - "did you build the solution via build.cmd?" - names the
            # build when the missing thing is packaging.
            #
            # 15.9 hit the same deadlock and fixed it by REORDERING rather than by excluding tests.
            # They first tried a namespace filter; it silently collapsed 32 attached test runs to 2
            # and was reverted. Do not re-buy that lesson: REORDER, NEVER EXCLUDE.
            #
            # THE COST OF THIS ORDER: none of the signing-gate kind. Sign runs AFTER Test with an
            # implicit succeeded(), so a test failure PREVENTS SIGNING. Proven empirically on the
            # first run, 3063908: Package succeeded, Test failed, Sign SKIPPED.
            #
            # An earlier version of this comment said "the tests no longer gate SIGNING... the
            # artifact is signed before the verdict exists". THAT IS 15.9's COST, NOT THIS LINE'S,
            # and it is recorded here with its owner named so nobody reintroduces it:
            #
            #   15.9    Build -> Package -> SIGN -> Test    signed before the verdict. Cost REAL.
            #   16.11   Build -> Package -> TEST -> Sign    signed after the verdict. NO SUCH COST.
            #
            # 15.9 could not reach this order and correctly states the cost of theirs; ours does
            # not have it. The sentence was imported along with their precedent without rechecking
            # whether it survived the change of order - taking a precedent means taking its
            # REASONING, not its conclusions.
            #
            # The unit invocation stays unchanged. NormalAcceptanceTests below separately selects
            # the acceptance assembly, which Arcade's unit-test naming convention does not select.
            # Acceptance runs after packaging and requires nonempty results from both frameworks.
            # Smoke, Performance and *PlatformTests are not added to this unit invocation.
            #
            # eng\build.ps1, not eng\common\Build.ps1: the wrapper owns -test, its filters and its
            # --test-parameter plumbing, and TestRunnerName=MSTest in eng/Versions.props is what
            # makes Arcade's RunTests target resolve at all.
            # STAGE THE CONSOLE THIS BUILD PRODUCED, for eng/Tests.targets to run the netcore suites
            # against. It overrides Arcade's RunTests for netcore only; .NET Framework stays on the
            # `dotnet test` path untouched, so the suites that work today are not disturbed.
            #
            # Neither console layout alone is runnable, both measured on 17.8. The package tree has
            # Extensions and TestHostNetFramework but its deps.json names a runtimes/ asset the
            # package does not carry, so it does not start. The build output starts but has neither
            # folder, so no trx logger is found. Overlaying the build output onto the package tree
            # gives both halves.
            #
            # This sets a PROPERTY rather than VSTEST_CONSOLE_PATH. That environment variable makes
            # the modern dotnet test CLI use this console, which is the arrangement that was
            # REVERTED on this branch: the CLI then appends an artifactsProcessingMode-collect
            # switch that a 16.11 console rejects, on every invocation, and the branch produced no
            # result files at all. Here the CLI is not in the path.
            - powershell: |
                $package = Get-ChildItem -Path "$(Build.SourcesDirectory)/artifacts" -Recurse -Filter 'Microsoft.TestPlatform.CLI.*.nupkg' -File |
                    Where-Object { $_.Name -notlike '*symbols*' } |
                    Select-Object -First 1
                if (-not $package) { throw 'Microsoft.TestPlatform.CLI package not found - cannot run the netcore suites against the console this build produced.' }
                $destination = Join-Path "$(Build.SourcesDirectory)" 'artifacts/tmp/$(_BuildConfig)/localConsole'
                if (Test-Path $destination) { Remove-Item -Recurse -Force $destination }
                Add-Type -AssemblyName System.IO.Compression.FileSystem
                [System.IO.Compression.ZipFile]::ExtractToDirectory($package.FullName, $destination)
                $console = Get-ChildItem -Path (Join-Path $destination 'contentFiles/any') -Recurse -Filter 'vstest.console.dll' -File |
                    Select-Object -First 1
                if (-not $console) { throw "no vstest.console.dll under $destination/contentFiles/any" }
                $binLayout = Join-Path "$(Build.SourcesDirectory)" "artifacts/bin/vstest.console/$(_BuildConfig)/$($console.Directory.Name)"
                if (-not (Test-Path $binLayout)) { throw "no build output for $($console.Directory.Name) at $binLayout - cannot complete the console layout." }
                Copy-Item -Recurse -Force (Join-Path $binLayout '*') $console.Directory.FullName

                # Start it once here. A console that cannot start is a failure of THIS step, which
                # names the layout, rather than empty trx files three steps later that read as test
                # failures. It also pages in a directory written moments earlier, which on the 17.x
                # lines took sixteen previously-failing suite runs to passing.
                $warmUp = & dotnet exec $console.FullName --help 2>&1
                if ($LASTEXITCODE -ne 0) {
                    throw "the console at $($console.FullName) did not start (exit $LASTEXITCODE): $($warmUp -join [Environment]::NewLine)"
                }
                Write-Host "package : $($package.Name)"
                Write-Host "console : $($console.FullName)"
                Write-Host "warm-up : console started, $(@($warmUp).Count) lines of help"
                Write-Host "##vso[task.setvariable variable=_LocalVSTestConsolePath]$($console.FullName)"
              displayName: Stage the vstest.console this build produced
              condition: succeeded()

            - powershell: eng\build.ps1
                -configuration $(_BuildConfig)
                -test
                -ci
                -prepareMachine
                -warnAsError 0
                -projects $(Build.SourcesDirectory)\TestPlatform.sln
                /p:LocalVSTestConsolePath=$(_LocalVSTestConsolePath)
              name: Test
              displayName: Test
              condition: succeeded()
              # The test step no longer decides whether signing happens; the gate below does.
              # continueOnError lets the job reach that gate. It does NOT weaken the control: a
              # test result that is not in the baseline, or that is in the baseline under a
              # different failure signature, still blocks signing - see Assert-KnownTestFailures.
              #
              # DO NOT REMOVE THIS LINE TO MAKE THE PIPELINE STRICTER. It does the opposite.
              # This branch has 22 declared known-failing tests - 15 Failed, 7 NotExecuted, mostly
              # environmental on a shared hosted agent - and they fail on EVERY run. Sign carries
              # condition: succeeded(), so a failing Test step means Sign is SKIPPED and the line
              # never signs at all. Measured before the gate existed, on build 3063908: Package
              # succeeded, Test failed, Sign SKIPPED. The strict outcome of removing this is not
              # "signing blocked on bad tests", it is "signing blocked on all tests, forever".
              #
              # It is COUPLED to Assert-KnownTestFailures and the two move together. If that gate
              # is ever removed, this line must come off in the SAME change - otherwise a red test
              # run reaches signing with nothing in between.
              continueOnError: true

            # AcceptanceTests is not selected by Arcade's unit-test naming convention on 16.11.
            # Run both supported frameworks explicitly, with the patched console and separate TRX files.
            # Acceptance has a strict result gate; do not mix its historical skips into the unit baseline.
            - pwsh: eng\Test-NormalAcceptanceTests.ps1
              displayName: Verify normal acceptance selection and result guards

            - pwsh: eng\Run-NormalAcceptanceTests.ps1
                -Configuration $(_BuildConfig)
                -LocalVSTestConsolePath "$(_LocalVSTestConsolePath)"
              name: NormalAcceptanceTests
              displayName: Normal acceptance tests (net451 and netcoreapp2.1)
              condition: succeeded()
              env:
                NUGET_PACKAGES: $(Build.SourcesDirectory)\.packages\

            - task: PublishTestResults@2
              displayName: Publish normal acceptance TRX results
              inputs:
                testResultsFormat: VSTest
                testResultsFiles: '*.normal.trx'
                searchFolder: $(Build.SourcesDirectory)\artifacts\AcceptanceTestResults\$(_BuildConfig)
                testRunTitle: Normal acceptance
                failTaskOnMissingResultsFile: true
                failTaskOnFailedTests: true
              condition: succeededOrFailed()

            # THE SIGNING GATE. It gates on UNCLASSIFIED results, not on zero failures.
            #
            # Build -> Package -> Test -> Sign is the shipping order and this line keeps it: nothing
            # is signed that failed its tests. But measured across four runs, every non-passing
            # result on this branch is environmental or a harness defect and NONE is product-shaped.
            # Ten of them match the set 15.9 measured independently on its own line. Gating on zero
            # failures therefore gates delivery on properties of the hosted agent, and the line
            # produces nothing at all - a gate that cannot open is not a gate, it is a stop.
            #
            # So eng\servicing-known-test-failures.json names every known non-passing test WITH the
            # failure signature it was classified on, and the gate blocks unless every non-passing
            # result matches one by NAME AND SIGNATURE. Matching on the name alone would make the
            # name a proxy for the cause: the same test failing later for a different reason would
            # be absorbed silently, and absorbed in the false-clean direction.
            #
            # It fails closed. No results directory, no .trx files, or zero parsed results all
            # BLOCK - an absence must not read as a pass, which is the failure mode that has cost
            # this project the most.
            #
            # It also reports baseline entries that did NOT fire, so an entry whose justification
            # has expired is visible rather than silently permanent.
            # pwsh, NOT powershell. Windows PowerShell 5.1's ConvertFrom-Json returns a JSON array as
            # a SINGLE object instead of enumerating it, which made this gate read its 24-entry
            # baseline as "1 entries" on build 3064083. Every comparison of the form $_.test -eq $name
            # then ran against an ARRAY of names and returned the matching elements rather than a
            # boolean; a non-empty array is truthy, so all 25 results appeared to match a baseline
            # entry by name, failed the signature check, and were reported as "known test, NEW failure
            # mode" with 0 known. Under PowerShell 7 the same file and the same script loaded 24
            # entries and passed. The script now enumerates defensively so it is correct under both,
            # and this pins the shell as well - two independent fixes, because the defect was silent
            # and produced a confident, plausible, wrong classification.
            - pwsh: |
                # _SignType IS ASSERTED HERE, IN THE STEP THAT ALREADY DECIDES WHETHER SIGNING HAPPENS.
                #
                # It is a static 'real' in a variables block and nothing verified it. Change that one
                # word to 'test' and Arcade dry-runs the signing: this gate still passes, Sign still
                # succeeds, the job still succeeds, both destinations still run, and the drop is still
                # named realsigned-DO-NOT-SHIP. Nothing on this line would fail, and the drop name
                # would be a claim the pipeline does not check. 15.9 found the same value unguarded on
                # their line, where it is worse - their variable is NAMED ArtifactsSigned while gating
                # only on "no step failed".
                #
                # BOTH the macro and the environment variable must read 'real'. Which one carries the
                # value to Arcade is not something this line could settle locally, so either mechanism
                # failing is a refusal rather than a guess.
                #
                # It THROWS rather than exiting, and the line below forwards the gate's own exit code
                # because the gate has no throw paths at all. Both are needed, and the reason is now
                # measured rather than assumed:
                #
                #   inline -Command string : process code = result of the LAST command in the string,
                #                            so a failing call propagates ONLY if nothing follows it
                #   script FILE            : process code = 0 unless the FILE ITSELF calls exit,
                #                            so a failing call is discarded even as the last statement
                #
                # A `pwsh: |` body is materialised as a file, which is the row that governs here: the
                # forwarding line is required whether or not anything follows the call. An earlier
                # comment justified it with "the wrapper runs on" - that is the INLINE mechanism and is
                # not why the file case loses it. Right conclusion, wrong reason, which is worse than a
                # wrong conclusion because nobody re-checks it.
                #
                # What is still not observable from a developer machine is what the ADO task itself
                # appends. It does not matter: the forwarding line produced exit 1 in every measured
                # row - inline and file, with and without a trailing statement - and a throw does not
                # depend on the answer at all.
                #
                # NOTHING IS ADDED TO THE SIGNING PATH: no new step, no certificate, no task. This is
                # four lines inside a step that already runs immediately before Sign.
                $macro = '$(_SignType)'
                $envv  = "$env:_SIGNTYPE"
                Write-Host "sign type - macro: '$macro'  env: '$envv'"
                if ($macro -ne 'real' -or $envv -ne 'real') {
                  throw "REFUSING: _SignType must read 'real' through BOTH the macro and the environment before this run may sign. Got macro='$macro', env='$envv'. A dry-run signs nothing and fails nothing, and the drop is named realsigned."
                }

                ./eng/Assert-KnownTestFailures.ps1 `
                  -ResultsDirectory "$(_TestResultsDirectory)" `
                  -BaselinePath "$(Build.SourcesDirectory)/eng/servicing-known-test-failures.json" `
                  -ExpectedProductVersionPrefix "16.11."
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              name: AssertKnownTestFailures
              displayName: Gate on unclassified test results, and refuse to sign unless _SignType is real
              condition: succeededOrFailed()

            - powershell: eng\common\Build.ps1
                -configuration $(_BuildConfig)
                -restore
                -sign
                -ci
                -prepareMachine
                -warnAsError 0
                -projects $(Build.SourcesDirectory)\TestPlatform.sln
                $(_SignArgs)
                $(_OfficialBuildIdArgs)
              name: Sign
              displayName: Sign
              # EXPLICIT, THOUGH THE DEFAULT IS THE SAME. This step declared no condition and relied
              # on the Azure DevOps default of succeeded(), which is correct and is the whole reason
              # signing stops when the gate above finds an unclassified test result: the gate is not
              # continueOnError, so a finding fails the job, and a failed job makes succeeded() false.
              # Observed on build 3063908 - Package succeeded, Test failed, Sign SKIPPED.
              #
              # It is written down because this is the single most consequential step on the line and
              # it was the only load-bearing one whose protection was INHERITED rather than declared.
              # The steps immediately around it declare conditions, and two of them use
              # succeededOrFailed() so they can run after a failure - which is exactly the value
              # somebody would copy onto this step while tidying, turning "signing stops when the gate
              # fires" into "signing proceeds past a failed gate" with no other visible change.
              #
              # Behaviourally identical to the bare form. It changes what a reader can rely on.
              condition: succeeded()

            # ============================================================================
            # THE VSSetup ARTIFACT. Without it this line CANNOT be inserted into VS.
            #
            # PORTED FROM 15.9. The insertion tool downloads the VSSetup artifact and opens
            # VSSetup\Insertion\<ComponentName>.vsman; TestsDrop.json is optional. This step
            # produces exactly that path.
            #
            # TWO EARLIER APPROACHES FAILED AND ARE RECORDED SO THEY ARE NOT RETRIED:
            #   1. Restore MicroBuild.Core and build the repo's own .vsmanproj. DEAD:
            #      MicroBuild.Core.targets is 451 bytes and only imports plugin targets from a
            #      MicroBuildPluginDirectory we never populate. enableMicrobuild installs the
            #      SIGNING plugin, not this one.
            #   2. Set UsingToolVSSDK/IsVsixProject and let Arcade build the VSIX project. DEAD,
            #      measured on 15.9's build 3068550:
            #        VisualStudio.VsixBuild.targets(153,5): error MSB4036: The
            #        "Microsoft.DotNet.Build.Tasks.VisualStudio.FinalizeInsertionVsixFile" task was not found
            #      scripts/build.ps1 drives raw msbuild, so Arcade's targets import through
            #      Directory.Build.props but their task assembly never loads.
            # Both failed the same way: ENABLING A TARGET IS NOT HAVING ITS IMPLEMENTATION.
            #
            # So Arcade's generator is called DIRECTLY. VisualStudio.SetupPackage.vsmanproj is
            # self-contained by construction - ImportDirectoryBuildProps=false,
            # ImportDirectoryBuildTargets=false, ResolveNuGetPackages=false - so it does not care
            # how the VSIX was built. Its whole input contract is:
            #     ComponentIntermediateOutputPath\*.stub   one line: VsixId/VsixFileName/VsixVersion
            #     SetupOutputPath\<VsixId>.json            the component manifest
            #     SetupOutputPath\<VsixFileName>           the VSIX
            #
            # 🛑 THE MANIFEST IS GENERATED, NEVER WRITTEN HERE. New-ServicingDrop.ps1 recorded what
            # a hand-built one cost on the 17.14 pilot: it "carried one info field where the real
            # manifest carries eight, including buildVersion, which is the value VS records as the
            # component version in .corext/Configs/testtools-components.json. That alone made this
            # drop unusable for insertion."
            #
            # NOTHING HERE SIGNS and the VSIX build is UNCHANGED - which is the point. The VSIX is
            # already signed by the Sign step above, and leaving packaging alone preserves the
            # equivalence measured against shipped 16.11.0: 495/495 package files with ZERO
            # AssemblyVersion changes.
            # ============================================================================
            - powershell: |
                $ErrorActionPreference = 'Stop'
                $root = $env:BUILD_SOURCESDIRECTORY
                $cfg  = $env:_BUILDCONFIG
                $component = 'Microsoft.VisualStudio.TestTools.TestPlatform.V2.CLI'

                $vsixDir = Join-Path $root ('artifacts\' + $cfg + '\VSIX')
                $vsixes = @(Get-ChildItem -LiteralPath $vsixDir -File -Filter '*.vsix' -ErrorAction SilentlyContinue)
                if ($vsixes.Count -ne 1) { throw ('Expected exactly one .vsix in ' + $vsixDir + ', found ' + $vsixes.Count + '. The component describes one VSIX and must not guess which.') }
                $vsix = $vsixes[0]
                $componentJson = Join-Path $vsixDir ($component + '.json')
                if (-not (Test-Path -LiteralPath $componentJson)) { throw ('Component manifest ' + $componentJson + ' is absent. The generator reads it as MergeManifest input.') }

                # ASSERT THE VSIX IS SIGNED. Publishing unsigned bits under the official artifact
                # name is worse than publishing nothing: the tool takes a hash that fails HashCheck.
                # Measured precedent - official 3052044 had OPC signature 1/1, VSTest1714VSSetup 0/0.
                # READ THE OPC SIGNATURE DIRECTLY. System.IO.Packaging is not usable here:
                # measured on 15.9's build 3068589, [Reflection.Assembly]::Load('WindowsBase')
                # fails with "Could not load file or assembly 'WindowsBase'" in this task's
                # Windows PowerShell host. Reading the signature part out of the package needs no
                # such assembly, and it lets the certificate be DECODED rather than counted.
                Add-Type -AssemblyName System.IO.Compression.FileSystem
                $zip = [IO.Compression.ZipFile]::OpenRead($vsix.FullName)
                try {
                  $sigEntry = $zip.Entries | Where-Object { $_.FullName -match '\.psdsxs$' } | Select-Object -First 1
                  if (-not $sigEntry) { throw ($vsix.Name + ' carries no OPC signature part. Refusing to stage unsigned bits into an artifact named VSSetup - the insertion tool would take a hash that then fails HashCheck.') }
                  $sr = New-Object IO.StreamReader($sigEntry.Open())
                  $sigXml = [xml]$sr.ReadToEnd()
                  $sr.Close()
                  $certNodes = $sigXml.GetElementsByTagName('X509Certificate')
                  if ($certNodes.Count -eq 0) { throw ($vsix.Name + ' has a signature part but no X509Certificate in it.') }
                  $certBytes = [Convert]::FromBase64String(($certNodes[0].InnerText -replace '\s',''))
                  $cert = New-Object Security.Cryptography.X509Certificates.X509Certificate2(,$certBytes)
                  Write-Host ('VSSETUP signer  : ' + $cert.Subject)
                  Write-Host ('VSSETUP issuer  : ' + $cert.Issuer)

                  # READ THE VERSION OUT OF THE VSIX, because the component .json does not carry one
                  # on this line and an absent version fails three steps later as a wrong diagnosis.
                  # Arcade builds its component from .stub files of the form Id/FileName/Version, and
                  # errors when the count of DISTINCT versions is not exactly one - a condition that
                  # is also true of ZERO. Measured on 3075806: the stub ended in a bare slash, the
                  # version printed empty, and the error read "contains multiple VSIX files with
                  # different versions:" with an EMPTY list. Nothing was duplicated; nothing was
                  # there. The vsix manifest is the authoritative statement of what was built.
                  $manifestEntry = $zip.Entries | Where-Object { $_.FullName -eq 'extension.vsixmanifest' } | Select-Object -First 1
                  if (-not $manifestEntry) { throw ($vsix.Name + ' carries no extension.vsixmanifest, so its version cannot be established.') }
                  $mr = New-Object IO.StreamReader($manifestEntry.Open())
                  $vsixManifestXml = [xml]$mr.ReadToEnd()
                  $mr.Close()
                  $identity = $vsixManifestXml.GetElementsByTagName('Identity')
                  if ($identity.Count -eq 0) { throw ($vsix.Name + ' has an extension.vsixmanifest with no Identity element.') }
                  $vsixVersionFromPackage = $identity[0].GetAttribute('Version')
                } finally { $zip.Dispose() }

                $cj = Get-Content -LiteralPath $componentJson -Raw | ConvertFrom-Json
                $vsixVersion = $cj.packages[0].version
                $payloadName = $cj.packages[0].payloads[0].fileName
                Write-Host ('VSSETUP component : ' + $component)
                Write-Host ('VSSETUP version from component json : ' + $vsixVersion)
                Write-Host ('VSSETUP version from vsix manifest   : ' + $vsixVersionFromPackage)

                # Prefer what the component manifest says, because that is what the generator merges.
                # Fall back to the package when it says nothing, and make the substitution visible
                # rather than silent - a version that appeared from somewhere else is exactly the
                # kind of thing the next reader needs to see.
                if (-not $vsixVersion) {
                  if (-not $vsixVersionFromPackage) { throw ('Neither ' + $componentJson + ' nor the vsix manifest carries a version. The component would be generated with no version at all, and Arcade reports that as "multiple VSIX files with different versions", which is the opposite of what is wrong.') }
                  Write-Host ('VSSETUP version   : component json carried none, taking the vsix manifest version ' + $vsixVersionFromPackage)
                  $vsixVersion = $vsixVersionFromPackage
                  $cj.packages[0].version = $vsixVersion
                }
                elseif ($vsixVersionFromPackage -and $vsixVersion -ne $vsixVersionFromPackage) {
                  throw ('The component manifest says version ' + $vsixVersion + ' but the built VSIX says ' + $vsixVersionFromPackage + '. The manifest and the drop would describe different builds.')
                }

                Write-Host ('VSSETUP version   : ' + $vsixVersion)
                if ($vsixVersion -match '2099123199') { throw ('The component manifest still carries the 20991231-99 sentinel (' + $vsixVersion + '). A version sorting above every real build can never be superseded.') }
                if ($payloadName -ne $vsix.Name) { throw ('The component manifest names payload ' + $payloadName + ' but the built VSIX is ' + $vsix.Name + '. The manifest and the drop would describe different files.') }

                # Arcade's layout, from RepoLayout.props.
                $setupRoot = Join-Path $root ('artifacts\VSSetup\' + $cfg)
                $insertion = Join-Path $setupRoot 'Insertion'
                $componentObj = Join-Path $root ('artifacts\VSSetup.obj\' + $cfg + '\' + $component)
                Remove-Item -LiteralPath $setupRoot -Recurse -Force -ErrorAction SilentlyContinue
                Remove-Item -LiteralPath $componentObj -Recurse -Force -ErrorAction SilentlyContinue
                New-Item -ItemType Directory -Force -Path $insertion, $componentObj | Out-Null
                # 🛑 REFRESH THE PAYLOAD SIZE FROM THE SIGNED VSIX BEFORE GENERATING.
                # The component .json is written during the VSIX build, which happens BEFORE
                # signing, so its declared payload size is the UNSIGNED size. The generator merges
                # that value straight through - it computes sha256 itself but trusts size - and the
                # manifest then describes a file that does not exist at that length. Measured on
                # 15.9's 3068664: manifest said 17,884,142, the signed vsix is 19,329,225, a
                # difference of 1,445,083 bytes of signature. HashCheck compares the drop against
                # the manifest, so this ships a drop rejected at insertion time.
                $cj.packages[0].payloads[0].size = $vsix.Length
                $refreshedJson = $cj | ConvertTo-Json -Depth 10 -Compress
                Set-Content -LiteralPath (Join-Path $insertion ($component + '.json')) -Value $refreshedJson -Encoding utf8
                Set-Content -LiteralPath (Join-Path $setupRoot ($component + '.json')) -Value $refreshedJson -Encoding utf8
                Write-Host ('VSSETUP payload size refreshed to signed length : ' + $vsix.Length)
                Copy-Item $vsix.FullName  (Join-Path $insertion $vsix.Name) -Force
                Copy-Item $vsix.FullName  (Join-Path $setupRoot $vsix.Name) -Force

                # Stub format is fixed by _GetVsixFileInfo: VsixId/VsixFileName/VsixVersion
                $stubLine = $component + '/' + $vsix.Name + '/' + $vsixVersion
                $stubPath = Join-Path $componentObj ([IO.Path]::GetFileNameWithoutExtension($vsix.Name) + '.stub')
                Set-Content -LiteralPath $stubPath -Value $stubLine -Encoding ascii -NoNewline
                Write-Host ('VSSETUP stub      : ' + $stubLine)

                # Both tools are ORDINARY NuGet packages - this is why the route needs no plugin
                # onboarding and no new permissions. SwixBuild 1.1.286 verified restoring from this
                # repo's own NuGet.config on 2026-09-07.
                $pkgRoot = $env:NUGET_PACKAGES
                if (-not $pkgRoot) { $pkgRoot = Join-Path $root '.packages' }
                if (-not $pkgRoot.EndsWith('\')) { $pkgRoot = $pkgRoot + '\' }
                $swixVersion = '1.1.286'
                $probe = Join-Path $root 'artifacts\vsman-tools'
                New-Item -ItemType Directory -Force -Path $probe | Out-Null
                Copy-Item (Join-Path $root 'NuGet.config') (Join-Path $probe 'NuGet.config') -Force
                $proj = @(
                  '<Project Sdk="Microsoft.NET.Sdk">'
                  '  <PropertyGroup><TargetFramework>net472</TargetFramework></PropertyGroup>'
                  '  <ItemGroup>'
                  ('    <PackageReference Include="Microsoft.VisualStudioEng.MicroBuild.Plugins.SwixBuild" Version="' + $swixVersion + '" />')
                  '  </ItemGroup>'
                  '</Project>')
                Set-Content -LiteralPath (Join-Path $probe 'swix.csproj') -Value $proj -Encoding UTF8
                & dotnet restore (Join-Path $probe 'swix.csproj') --packages $pkgRoot --nologo
                if ($LASTEXITCODE -ne 0) { throw ('SwixBuild ' + $swixVersion + ' restore failed with exit ' + $LASTEXITCODE + '.') }
                $swixPath = $pkgRoot + 'microsoft.visualstudioeng.microbuild.plugins.swixbuild\' + $swixVersion + '\'
                if (-not (Test-Path -LiteralPath $swixPath)) { throw ('SwixBuild restored but ' + $swixPath + ' is absent.') }

                & dotnet restore (Join-Path $root 'eng\common\internal\Tools.csproj') --packages $pkgRoot --nologo
                if ($LASTEXITCODE -ne 0) { Write-Host 'MANIFESTTOOL restore failed; SBOM generation is disabled below rather than failing the build.' }
                $manifestTool = ''
                $mtDir = Join-Path $pkgRoot 'microsoft.manifesttool.crossplatform'
                if (Test-Path -LiteralPath $mtDir) {
                  $mt = Get-ChildItem -LiteralPath $mtDir -Directory | Sort-Object Name -Descending | Select-Object -First 1
                  if ($mt) { $candidate = Join-Path $mt.FullName 'Content\Microsoft.ManifestTool.dll'; if (Test-Path -LiteralPath $candidate) { $manifestTool = $candidate } }
                }
                $generateSbom = 'true'
                if (-not $manifestTool) { $generateSbom = 'false'; Write-Host 'MANIFESTTOOL absent - generating WITHOUT an SBOM. Reported, not hidden: the _sbom.json belongs in the drop with its hash in the .vsman.' }

                # THE URL MUST EQUAL THE DROP THIS BUILD UPLOADS. On this line the drop name is a
                # VARIABLE shared with the upload output, so it is read from the variable rather
                # than recomposed here - recomposing is how 17.14 ended up with a manifest pointing
                # where the content was not.
                $dropName = $env:VS_DROP_NAME
                if (-not $dropName) { throw 'VS_DROP_NAME is empty. The manifest url must equal the drop this build uploads.' }
                Write-Host ('VSSETUP dropName  : ' + $dropName)

                $arcadeVersion = (Get-Content -LiteralPath (Join-Path $root 'global.json') -Raw | ConvertFrom-Json).'msbuild-sdks'.'Microsoft.DotNet.Arcade.Sdk'
                $vsmanproj = $pkgRoot + 'microsoft.dotnet.arcade.sdk\' + $arcadeVersion + '\toolset\VisualStudio.SetupPackage.vsmanproj'
                if (-not (Test-Path -LiteralPath $vsmanproj)) { throw ('Arcade generator not found at ' + $vsmanproj) }

                $msbuildExe = $null
                $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
                if (Test-Path -LiteralPath $vswhere) {
                  $vsPath = & $vswhere -latest -prerelease -products * -requires Microsoft.Component.MSBuild -property installationPath | Select-Object -First 1
                  if ($vsPath) {
                    foreach ($rel in @('MSBuild\Current\Bin\amd64\MSBuild.exe','MSBuild\Current\Bin\MSBuild.exe')) {
                      $c = Join-Path $vsPath $rel
                      if (Test-Path -LiteralPath $c) { $msbuildExe = $c; break }
                    }
                  }
                }
                if (-not $msbuildExe) { throw 'Desktop MSBuild was not found. The generator imports MicroBuild SwixBuild targets and must not run under dotnet msbuild.' }

                $dotnetTool = Join-Path $root '.dotnet\dotnet.exe'
                if (-not (Test-Path -LiteralPath $dotnetTool)) { $dotnetTool = (Get-Command dotnet -ErrorAction Stop).Source }

                $msbuildArgs = @(
                  $vsmanproj, '/nologo', '/v:minimal', '/t:_BuildManifest'
                  '/p:OfficialBuild=true'
                  ('/p:ComponentName=' + $component)
                  ('/p:SetupOutputPath=' + $insertion + '\')
                  ('/p:ComponentIntermediateOutputPath=' + $componentObj + '\')
                  ('/p:SwixBuildPath=' + $swixPath)
                  ('/p:VisualStudioDropName=' + $dropName)
                  ('/p:DotNetTool=' + $dotnetTool)
                  ('/p:ManifestTool=' + $manifestTool)
                  ('/p:GenerateSbom=' + $generateSbom))
                & $msbuildExe @msbuildArgs
                if ($LASTEXITCODE -ne 0) { throw ('Arcade VisualStudio.SetupPackage.vsmanproj exited ' + $LASTEXITCODE + '.') }

                # ASSERT THE ARTIFACT, not the exit code.
                $vsman = @(Get-ChildItem -LiteralPath $setupRoot -Recurse -File -Filter '*.vsman')
                if ($vsman.Count -ne 1) { throw ('Found ' + $vsman.Count + ' .vsman under ' + $setupRoot + '. The tool takes the FIRST payload whose url contains a semicolon, so there must be exactly one.') }
                $manifestText = Get-Content -LiteralPath $vsman[0].FullName -Raw
                if ($manifestText -notmatch [regex]::Escape($dropName)) { throw ('The generated .vsman does not carry the drop path ' + $dropName + '.') }
                Write-Host 'VSSETUP layout:'
                Get-ChildItem -LiteralPath $setupRoot -Recurse -File | ForEach-Object { Write-Host ('  {0,12:N0}  {1}' -f $_.Length, $_.FullName.Substring($setupRoot.Length).TrimStart('\')) }
              displayName: Assemble the VSSetup artifact
              # PULL REQUEST: skipped, because a pull request build does not sign. The OPC signature
              # check inside this step is doing its job when it refuses an unsigned VSIX - measured
              # on 3077574, 'TestPlatform.vsix carries no OPC signature part' - so the step is not
              # run rather than the check being weakened. The check, the signature requirement and
              # every non-pull-request path are untouched, and no unsigned VSSetup is ever staged or
              # published.
              condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
              env:
                VS_DROP_NAME: $(VisualStudioDropName)

            # VALIDATE THE MANIFEST FIELD BY FIELD, against the shape 18.10 already produces and
            # RoslynTools already accepts. A manifest missing fields has bitten this work before and
            # it fails at INSERTION time, not build time - one info field where the real manifest
            # carries eight is what made the 17.14 pilot drop unusable.
            - powershell: |
                $ErrorActionPreference = 'Stop'
                $setupRoot = Join-Path $env:BUILD_SOURCESDIRECTORY ('artifacts\VSSetup\' + $env:_BUILDCONFIG)
                $vsmanFile = @(Get-ChildItem -LiteralPath $setupRoot -Recurse -File -Filter '*.vsman')[0]
                $m = Get-Content -LiteralPath $vsmanFile.FullName -Raw | ConvertFrom-Json
                $fail = New-Object System.Collections.Generic.List[string]

                foreach ($k in @('manifestVersion','info','signers','packages')) {
                  if (-not $m.PSObject.Properties.Name.Contains($k)) { $fail.Add('top-level key missing: ' + $k) }
                }
                $expectedInfo = @('id','buildVersion','localBuild','manifestName','productDisplayVersion','productPatchVersion','productPreReleaseMilestoneSuffix','productSemanticVersion')
                foreach ($k in $expectedInfo) {
                  if (-not $m.info.PSObject.Properties.Name.Contains($k)) { $fail.Add('info field missing: ' + $k) }
                  elseif ([string]::IsNullOrWhiteSpace([string]$m.info.$k)) { $fail.Add('info field empty: ' + $k) }
                }
                Write-Host ('MANIFEST info fields : ' + $m.info.PSObject.Properties.Name.Count + ' (expect ' + $expectedInfo.Count + ')')
                $m.info.PSObject.Properties | ForEach-Object { Write-Host ('  info.' + $_.Name + ' = ' + $_.Value) }

                if ($m.packages.Count -ne 1) { $fail.Add('expected exactly 1 package, found ' + $m.packages.Count) }
                $p = $m.packages[0]
                foreach ($k in @('id','version','type','payloads','vsixId','extensionDir','installSizes')) {
                  if (-not $p.PSObject.Properties.Name.Contains($k)) { $fail.Add('package field missing: ' + $k) }
                }
                if ($p.type -ne 'Vsix') { $fail.Add('package type is ' + $p.type + ', expected Vsix') }
                if ($m.info.buildVersion -ne $p.version) { $fail.Add('info.buildVersion ' + $m.info.buildVersion + ' != package version ' + $p.version) }
                if ($m.info.buildVersion -match '2099123199' -or $m.info.buildVersion -match '42\.42\.42') { $fail.Add('info.buildVersion is a placeholder: ' + $m.info.buildVersion) }

                $signedPayloads = 0
                foreach ($pl in $p.payloads) {
                  $n = $pl.fileName
                  foreach ($k in @('fileName','sha256','size','url','_buildInfo')) {
                    if (-not $pl.PSObject.Properties.Name.Contains($k)) { $fail.Add($n + ': payload field missing: ' + $k) }
                  }
                  if ($pl.url -notmatch ';') { $fail.Add($n + ": payload url has no ';' - GetComponentFromManifestFile splits on it and would find no payload") }
                  if (-not $pl._buildInfo.crc) { $fail.Add($n + ': _buildInfo.crc missing') }
                  if ($pl.PSObject.Properties.Name.Contains('signer')) { $signedPayloads++ }
                  $onDisk = Join-Path $vsmanFile.Directory.FullName $n
                  if (-not (Test-Path -LiteralPath $onDisk)) { $fail.Add($n + ': listed in the manifest but ABSENT from the insertion folder, so the drop and the manifest describe different files') }
                  else {
                    $actualSize = (Get-Item -LiteralPath $onDisk).Length
                    $actualHash = (Get-FileHash -LiteralPath $onDisk -Algorithm SHA256).Hash.ToLowerInvariant()
                    if ($pl.size -ne $actualSize) { $fail.Add($n + ': manifest size ' + $pl.size + ' != actual ' + $actualSize) }
                    if ($pl.sha256.ToLowerInvariant() -ne $actualHash) { $fail.Add($n + ': manifest sha256 does not match the file on disk - this is what HashCheck rejects') }
                    Write-Host ('MANIFEST payload OK  : ' + $n + '  ' + $actualSize + ' B')
                  }
                }
                if ($signedPayloads -lt 1) { $fail.Add('no payload carries a signer record, so the manifest does not describe the VSIX as signed') }
                if (-not $m.signers -or $m.signers.Count -lt 1) { $fail.Add('signers array is missing or empty') }

                if ($fail.Count -gt 0) {
                  Write-Host ('MANIFEST VALIDATION FAILED with ' + $fail.Count + ' problem(s):')
                  $fail | ForEach-Object { Write-Host ('  - ' + $_) }
                  throw 'The generated .vsman does not match the shape RoslynTools accepts. A manifest missing fields fails at insertion time, not here, so it is rejected now.'
                }
                Write-Host ('MANIFEST VALIDATION PASSED - ' + $expectedInfo.Count + ' info fields, ' + $p.payloads.Count + ' payloads, all hashes and sizes match the drop')
              displayName: Validate the insertion manifest
              # PULL REQUEST: skipped. It validates the manifest the assemble step above produces,
              # and that step does not run in a pull request build.
              condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

            # Mints the token the VS drop needs, using the SAME service connection main uses for the
            # same purpose. This runs in steps: and the drop runs in templateContext.outputs:, which
            # the 1ES template appends after every step - so the variable is set before it is read.
            #
            # WHY THIS EXISTS, measured on build 3063057 rather than anticipated:
            #
            # Without an accessToken the task still runs, and drop.exe falls back to
            #   drop.exe Create --DropService "https://devdiv.artifacts.visualstudio.com/" --AadAuth
            # authenticating as the AGENT. This pipeline is dnceng/internal and the drop service is
            # DevDiv's, so that identity has no token for it:
            #   AadAcquireTokenException ... StatusInternal::InteractionRequired
            #   Operation ended with exit code: 100
            #
            # The DevDiv drop service is CORRECT and is not the mistake - vstest's drops have always
            # gone there, and main targets the same service. The mistake was omitting the credential
            # and assuming a task with no auth input would use the ambient one.
            #
            # The token is scoped by the service connection, not by this file. It is marked issecret
            # so it is masked in logs; the drop it can write to is still constrained by the
            # DO-NOT-SHIP name below, which is the part this branch controls.
            - task: AzureCLI@2
              displayName: Mint DevDiv drop access token
              inputs:
                azureSubscription: 'dnceng-devdiv-drop-rw-code-rw-wif'
                scriptType: pscore
                scriptLocation: inlineScript
                inlineScript: |
                  $token = az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv
                  Write-Host "##vso[task.setvariable variable=_DevDivDropAccessToken;issecret=true]$token"
              condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
