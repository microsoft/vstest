# Branches that trigger a build on commit
trigger:
  branches:
    include:
    - main
    - rel/*
    # A merge into internal/rel/<version> must build. rel/* does not match it, so until
    # this line existed a merged servicing change sat unbuilt until someone queued it by
    # hand. Azure DevOps reads this file from the branch that was pushed, so this can only
    # ever select this branch's own servicing line.
    - internal/rel/*
    exclude:
    - rel/15.*
    - rel/16.*
    - rel/17.0
    - rel/17.1
    - rel/17.2
    - rel/17.3
    - rel/17.4
    - rel/17.5
    - rel/17.6

# The public build in azure-pipelines.yml validates pull requests. This internal build runs on trigger only.
pr: none

parameters:
- name: isRTM
  displayName: "Produce RTM version?"
  type: boolean
  default: False
- name: SDLEnabled
  displayName: "Run SDL validation"
  type: boolean
  default: False
# This option should be used with caution. This is useful for unblocking circular deps issue with testanywhere
- name: SkipTests
  displayName: "Skip tests"
  type: boolean
  default: False

- name: otherOsPools
  type: object
  default:
  - name: $(DncEngInternalBuildPool)
    image: 1es-ubuntu-2204
    os: linux
  - name: Azure Pipelines
    image: macos-14
    os: macOS

variables:
  - template: /eng/common/templates-official/variables/pool-providers.yml@self
  # Cannot use key:value syntax in root defined variables
  - name: _TeamName
    value: TestPlatformTeam
  - name: Codeql.Enabled
    value: true
  - name: _RunAsInternal
    value: True
  - name: _RunAsPublic
    value: False
  - name: _ReleaseVersionKind
    value: ''
  # Arcade is using global cache of nugets in non-windows build
  # under some circumstances, but we don't respect that in our code and try to find them
  # in .packages. Force the location of packages to that folder.
  - name: NUGET_PACKAGES
    value: '$(Build.SourcesDirectory)/.packages/'
  # Publish Logs seems to depend on this name of variable, so we define it
  # even when we don't use matrix.
  - name: _BuildConfig
    value: Release

  - ${{ if eq(parameters.isRTM, True) }}:
    - name: _ReleaseVersionKind
      value: release

  # DevDiv drop access token is acquired via WIF service connection (dnceng-devdiv-drop-rw-code-rw-wif).
  # The DotNet-VSTS-Infra-Access and DotNet-Symbol-Server-Pats variable groups this file used to
  # reference no longer exist; their PATs were migrated to WIF and disabled. See main's fdd72c528,
  # "Remove dead DotNet-VSTS-Infra-Access variable group reference (#16203)".
  - name: _DevDivDropAccessToken
    value: ''
  - name: _SignType
    # REAL SIGNING. ESRP authentication is now supplied by the supported Arcade mechanism:
    # eng/common/core-templates/steps/install-microbuild.yml, which passes ConnectedServiceName,
    # ConnectedPMEServiceName and SYSTEM_ACCESSTOKEN to the MicroBuild plugin. That file arrives
    # with the Arcade 11 sync; this branch previously hand-patched the vendored job.yml to do the
    # same thing, and that patch has been removed in favour of the real template.
    #
    # Test signing cannot exercise this path: it uses a local test certificate and never contacts
    # ESRP, so it is mute on the hypothesis. Two green test-sign runs (3062041, 3062123) proved the
    # wiring - ItemsToSign populated, both rounds reproducing 556 and 22 - and nothing else.
    value: real
  - name: _SignArgs
    value: /p:DotNetSignType=$(_SignType) /p:TeamName=$(_TeamName) /p:Sign=$(_Sign)
  # PULL REQUEST VALIDATION, ported from 18.12. A pull request build must not sign and must not
  # restore the internal tools; both steps are delivery-only. Every non-pull-request value below is
  # byte-identical to what this branch used before, so branch builds are unchanged.
  #
  # _SignType is deliberately left at real. The servicing branches gate on it - they refuse to sign
  # unless it is real - and a pull request build satisfies that gate by not signing at all rather
  # than by claiming a different type.
  #
  # SETTING _Sign ALONE DOES NOTHING, which cost 18.12 build 3076572. On this branch _Sign is read
  # only by _SignArgs, and _SignArgs IS NEVER REFERENCED ANYWHERE - verified, the single consumer of
  # the build arguments is $(_InternalBuildArgs) at the Build step. Signing comes from CIBuild.cmd,
  # which always passes -sign, which build.ps1 turns into /p:Sign=True. The override below works
  # because build.ps1 appends @properties AFTER /p:Sign=$sign, so /p:Sign in _InternalBuildArgs is
  # the last one and wins. If that ordering ever changes, this stops working silently and the
  # signing verification failure comes back.
  - ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
    - name: _Sign
      value: false
  - ${{ if ne(variables['Build.Reason'], 'PullRequest') }}:
    - name: _Sign
      value: True
  - name: VisualStudioDropName
    # VALIDATION CARRIER: the project and definition segments are pinned rather than taken from
    # $(System.TeamProject)/$(Build.DefinitionName), so this file proves the destination is internal
    # instead of inheriting it from wherever the pipeline happens to run. The branch segment keeps
    # this validation drop off the real 17.14 drop path.
    #
    # THE realsigned-DO-NOT-SHIP- PREFIX BELONGS HERE, NOT ONLY ON THE UPLOAD TASK. This value is
    # passed to the BUILD at /p:VisualStudioDropName below and is baked into the payload URLs inside
    # the .vsman. The upload task's destination and this value must be the SAME STRING, and when they
    # were two hand-written literals they diverged: the prefix was added to the destination only.
    # The manifest URL pointed to the old drop path while the upload used the signed path.
    # VS consuming that manifest would 404 on every payload. One variable, referenced twice, cannot
    # diverge; two literals describing one path already had.
    value: Products/internal/microsoft-vstest/realsigned-DO-NOT-SHIP-$(Build.SourceBranchName)/$(Build.BuildNumber)
  # A pull request build publishes nothing, so it needs no SBOM - the publish steps are already
  # gated on Build.Reason for exactly that reason. Generating one also drags in the internal tools
  # restore, and that step FAILS OUTRIGHT in a pull request build: eng/common/internal/Tools.csproj
  # references both MicroBuild.Core and MicroBuild.Plugins.SwixBuild, NuGet's generated
  # Tools.csproj.nuget.g.props imports the Swix props, MicroBuild.Core.props imports the same file
  # again, and -ci turns that MSB4011 duplicate-import warning into an error.
  #
  # eng/restore-internal-tools.yml on this branch ALREADY reads _skipRestoreInternalTools, but
  # nothing defined it - so the condition evaluated ne('', 'true') and the step ran anyway. This
  # adds the missing producer; it does not change the consumer.
  - ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
    - name: _skipRestoreInternalTools
      value: true
    - name: _SbomArgs
      value: ''
  - ${{ if ne(variables['Build.Reason'], 'PullRequest') }}:
    - name: _skipRestoreInternalTools
      value: false
    - name: _SbomArgs
      value: /p:GenerateSbom=true
  - name: _InternalBuildArgs
    value: /p:DotNetSignType=$(_SignType)
      /p:TeamName=$(_TeamName)
      /p:DotNetFinalVersionKind=$(_ReleaseVersionKind)
      /p:DotNetPublishUsingPipelines=true
      /p:OfficialBuildId=$(BUILD.BUILDNUMBER)
      /p:VisualStudioDropName=$(VisualStudioDropName)
      /p:Sign=$(_Sign)
      $(_SbomArgs)

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    sdl:
      policheck:
        enabled: true
      tsa:
        enabled: true
    pool:
      name: $(DncEngInternalBuildPool)
      image: windows.vs2026preview.scout.amd64
      os: windows
    customBuildTags:
    - ES365AIMigrationTooling
    stages:
    - stage: build
      displayName: Build
      jobs:

      - template: /eng/common/templates-official/jobs/jobs.yml@self
        parameters:
          enableMicrobuild: true
          enablePublishBuildArtifacts: true
          # Register only official builds of this private servicing branch, never PRs.
          enablePublishBuildAssets: ${{ and(eq(variables['System.TeamProjectId'], '7ea9116e-9fac-403d-b258-b31fcf1bb293'), eq(variables['Build.Repository.ID'], 'ef257391-4d76-4240-8649-3f21ac49c392'), eq(variables['Build.SourceBranch'], 'refs/heads/internal/rel/17.14'), ne(variables['Build.Reason'], 'PullRequest')) }}
          enablePublishTestResults: true
          testResultsFormat: 'vstest'
          enableTelemetry: true
          # The PR target branch is not available during template expansion; validate this branch's YAML in PRs too.
          enableSourceBuild: true
          # Arcade forwards named source-build parameters from a mapping, not a list.
          sourceBuildParameters:
            defaultManagedPlatform:
              name: Managed
              container: mcr.microsoft.com/dotnet-buildtools/prereqs:centos-stream-10-amd64
              buildScript: bash ./eng/BuildSourceBuildIntermediate.sh
              buildArguments: /p:OfficialBuildId=$(Build.BuildNumber) /p:DotNetFinalVersionKind=$(_ReleaseVersionKind)
          publishBuildAssetsDependsOn:
          - job: Windows
          - ${{ each pool in parameters.otherOsPools }}:
            - job: ${{ pool.os }}
          - job: Source_Build_Managed
          jobs:
          - job: Windows
            # Timeout governs the WHOLE JOB, not the Build task. Measured on 2781732, the only
            # known-good run of this job on this line: Build 22.4 min, Test 54.1 min, JOB TOTAL
            # 86.0 min. An earlier diagnostic run set 45 here by comparing against the Build task
            # alone and would have been killed mid-Test, before linux, macOS and the drop could run.
            timeoutInMinutes: 120
            pool:
              name: $(DncEngInternalBuildPool)
              image: windows.vs2026preview.scout.amd64
              os: windows
            templateContext:
              outputs:
              - ${{ if eq(parameters.isRTM, True) }}:
                - output: pipelineArtifact
                  displayName: Publish ReleasePackages
                  targetPath: '$(Build.ArtifactStagingDirectory)\ReleasePackages'
                  artifactName: ReleasePackages
                  sbomEnabled: false
                  condition: and(succeeded(), eq(variables['System.TeamProject'], 'internal'), ne(variables['Build.Reason'], 'PullRequest'))
            steps:
            # This steps help to understand versions of .NET runtime installed on the machine,
            # which is useful to diagnose some governance issues.
            - task: DotNetCoreCLI@2
              displayName: 'dotnet --info'
              inputs:
                command: custom
                custom: '--info'

            # Restore internal tools required for SBOM generation
            - template: /eng/restore-internal-tools.yml

            - powershell: eng\common\CIBuild.cmd
                -configuration Release
                -prepareMachine
                $(_InternalBuildArgs)
                /p:Test=false
                /p:SourceBranchName=$(Build.SourceBranchName)
              name: Build
              displayName: Build

            - ${{ if eq(parameters.SkipTests, False) }}:
              # The two acceptance tests that fail with NU1301 scaffold a project with
              # `dotnet new mstest` under the agent temp directory and restore it:
              #
              #   PostProcessingTests.cs:46              dotnet new mstest -o {TempDirectory}\{i}
              #   DotnetHostArchitectureVerifierTests:45 dotnet new mstest  (cwd = TempDirectory)
              #   TempDirectory.cs:112  root = AGENT_TEMPDIRECTORY ?? Path.GetTempPath()
              #   TempDirectory.cs:97   full = <root>\vstest\<randomId>
              #
              # NuGet walks UP from the project looking for a NuGet.config. Nothing sits between
              # that folder and the drive root, so it falls back to the machine default, which
              # lists api.nuget.org - refused inside 1ES network isolation.
              #
              # The harness already solves this for assets it COPIES (AcceptanceTestBase.cs:160-166,
              # which also rewrites ".packages" to an absolute path). That code only runs for
              # .csproj assets (line 141), so a scaffolded project never gets it. This step puts
              # the same file one level above vstest\<id>\ so scaffolded projects inherit it.
              #
              # GENERATED FROM THE REPO'S OWN NuGet.config rather than hand-written: that file is
              # the only place the feed list is maintained, and a second copy would drift silently.
              # Tests that copy a .csproj still write their own config deeper, which carries
              # <clear /> and therefore discards these sources - so they are unaffected.
              - powershell: |
                  $src = Join-Path $env:BUILD_SOURCESDIRECTORY 'NuGet.config'
                  $dst = Join-Path $env:AGENT_TEMPDIRECTORY 'NuGet.config'
                  if (-not (Test-Path $src)) { throw "repo NuGet.config not found at $src" }
                  $pkgs = Join-Path $env:BUILD_SOURCESDIRECTORY '.packages'
                  (Get-Content $src -Raw).Replace('".packages"', '"' + $pkgs + '"') |
                      Set-Content -Path $dst -Encoding utf8
                  if (-not (Test-Path $dst)) { throw "generated NuGet.config was not created at $dst" }
                  $text = Get-Content $dst -Raw
                  if ([string]::IsNullOrWhiteSpace($text)) { throw "generated NuGet.config is empty at $dst" }
                  Write-Host "wrote $dst"
                  # Assert PRESENCE of an expected source, not merely absence of a bad one - a
                  # truncated or malformed file would pass an absence-only check.
                  if ($text -notmatch 'key="dotnet-public"') {
                      throw 'generated NuGet.config does not name dotnet-public - refusing'
                  }
                  if ($text -match 'api\.nuget\.org') {
                      throw 'generated NuGet.config names api.nuget.org - refusing'
                  }
                  Write-Host "sources:"
                  ([xml]$text).configuration.packageSources.add |
                      ForEach-Object { "  $($_.key)" }
                displayName: Provide a NuGet.config to scaffolded test projects
                condition: succeeded()

              # Arcade shells out to dotnet test on assemblies. The SDK forwarding app reads this
              # environment variable; the VSTestConsolePath MSBuild property does not reach it.
              - powershell: eng\prepare-test-console.ps1 -Configuration Release
                displayName: Use the vstest.console this build produced
                condition: succeeded()

              # -ci is allowing to import some environment variables and some required configurations
              # -nobl avoid overwriting binlog of the main Build
              - script: Test.cmd
                  -configuration Release
                  -ci
                  -nobl
                  -integrationTest
                  -performanceTest
                name: Test
                displayName: Test
                # Pin the test's dotnet root to the one Arcade installed and the build used, rather
                # than letting it resolve whatever dotnet the agent happens to expose. This is what
                # main does on both of its test steps; rel/17.14 has no env block at all.
                #
                #   2781732  rel/17.14  2025-08-28  not set  PASSED
                #   3061982  main       2026-08-31  SET      PASSED
                #   3062123  Carrier    2026-08-31  not set  FAILED
                #
                # The acceptance tests scaffold throwaway projects under the agent temp directory and
                # restore them. That is outside the repo, so the repo NuGet.config does not apply and
                # the restore falls back to the machine configuration, which lists api.nuget.org -
                # refused inside 1ES network isolation with NU1301. Which dotnet root is in force
                # determines which fallback folders the restore can see.
                #
                # This touches NO file under test/ or src/. It removes an uncontrolled input rather
                # than suppressing a signal, and it matches a configuration that passes today.
                env:
                  DOTNET_ROOT: $(Build.SourcesDirectory)/.dotnet
                  VSTEST_CONSOLE_PATH: $(_LocalVSTestConsolePath)

              # The test results folder is not produced when the job fails before any test runs,
              # and publishing a missing path would report a second, misleading failure.
              - pwsh: |
                  $dir = "$(Build.SourcesDirectory)/artifacts/TestResults/Release"
                  $hasFiles = (Test-Path -LiteralPath $dir) -and (@(Get-ChildItem -LiteralPath $dir -File -Recurse -ErrorAction SilentlyContinue).Count -gt 0)
                  Write-Host "##vso[task.setvariable variable=HasTestResults]$($hasFiles.ToString().ToLowerInvariant())"
                displayName: 'Check for Test Results folders'
                condition: failed()

              # This step is only helpful for diagnosing some issues with vstest/test host that would not appear
              # through the console or trx
              - task: 1ES.PublishBuildArtifacts@1
                displayName: 'Publish Test Results folders'
                inputs:
                  PathtoPublish: '$(Build.SourcesDirectory)/artifacts/TestResults/Release'
                  ArtifactName: TestResults
                condition: and(failed(), eq(variables['HasTestResults'], 'true'))

            - task: 1ES.PublishBuildArtifacts@1
              displayName: 'Publish VSSetup'
              inputs:
                PathtoPublish: '$(Build.SourcesDirectory)/artifacts/VSSetup/Release'
                ArtifactName: VSSetupArtifacts

            - ${{ if eq(parameters.isRTM, True) }}:
              - pwsh: |
                  $ErrorActionPreference = 'Stop'
                  $source = "$(Build.SourcesDirectory)\artifacts\packages\Release\Shipping"
                  $destination = "$(Build.ArtifactStagingDirectory)\ReleasePackages"
                  $packages = @(Get-ChildItem -LiteralPath $source -Filter '*.nupkg' -File |
                    Where-Object { $_.Name -notlike '*.symbols.nupkg' })
                  if ($packages.Count -eq 0) {
                    throw "No shipping NuGet packages were found in '$source'."
                  }
                  New-Item -ItemType Directory -Path $destination -Force | Out-Null
                  foreach ($package in $packages) {
                    Copy-Item -LiteralPath $package.FullName -Destination $destination
                  }
                displayName: Stage ReleasePackages
                condition: and(succeeded(), eq(variables['System.TeamProject'], 'internal'), ne(variables['Build.Reason'], 'PullRequest'))

          - ${{ each pool in parameters.otherOsPools }}:
            - job: ${{ pool.os }}
              dependsOn: Windows
              workspace:
                clean: all
              pool:
                name: ${{ pool.name }}
                demands: ImageOverride -equals ${{ pool.image }}
                os: ${{ pool.os }}
                image: ${{ pool.image }}
              steps:
              - checkout: self
                fetchDepth: 1
                clean: true

              - ${{ if eq(pool.os, 'linux') }}:
                # A regular interactive login creates /run/user/<uid> (the XDG_RUNTIME_DIR convention) via
                # pam_systemd, which the artifacts-directory fallback (GetUserPrivateTempPath) relies on as
                # the current user's private temporary directory. The hosted agent never logs in that way, so
                # the directory is missing and that fallback path goes untested. Create it here the same way a
                # login session would, rather than loosening the product code or the tests to tolerate it
                # being absent.
                - script: |
                    set -e
                    uid=$(id -u)
                    sudo mkdir -p "/run/user/$uid"
                    sudo chown "$uid" "/run/user/$uid"
                    sudo chmod 700 "/run/user/$uid"
                  displayName: Ensure the XDG runtime directory exists

              # Build but don't pack, packing does not work on non-windows and we want to test what we built on Windows
              # anyway. Because that is what we will publish.
              - script: ./build.sh
                  --configuration Release
                  --ci
                name: Build
                displayName: Build

              # Download the built packages into local package source, as if we built them on this machine.
              - task: DownloadPipelineArtifact@2
                displayName: Download Package Artifacts
                inputs:
                  artifactName: PackageArtifacts
                  targetPath: '$(Build.SourcesDirectory)/artifacts/packages/Release/Shipping'

              - ${{ if eq(parameters.SkipTests, False) }}:
                # Same fix as the Windows job: the acceptance tests scaffold a project with
                # `dotnet new mstest` under the agent temp directory and restore it, and NuGet
                # walks up from there and finds no NuGet.config before the filesystem root.
                #
                # This block covers BOTH linux and macOS (they share the ${{ pool.os }} job).
                # Build 3063909 is the evidence for why it is needed here and not only on
                # Windows: with the step on Windows only, Windows went 2 failures -> 0 while
                # linux failed on DotnetSDKSimulation_PostProcessing - the same test, on the
                # OS where the step was absent. Separate jobs, separate agents, separate
                # AGENT_TEMPDIRECTORY.
                - script: |
                    set -e
                    src="$BUILD_SOURCESDIRECTORY/NuGet.config"
                    dst="$AGENT_TEMPDIRECTORY/NuGet.config"
                    if [ ! -f "$src" ]; then echo "repo NuGet.config not found at $src" >&2; exit 1; fi
                    sed 's|"\.packages"|"'"$BUILD_SOURCESDIRECTORY"'/.packages"|' "$src" > "$dst"
                    # Assert the file EXISTS and is non-empty before inspecting it. `grep -q` on a
                    # missing file returns non-zero, which an "if grep -q bad-thing" guard reads as
                    # CLEAN - "I could not look" rendering as "I found nothing". Observed while
                    # testing this very script.
                    if [ ! -s "$dst" ]; then echo "generated NuGet.config missing or empty at $dst" >&2; exit 1; fi
                    echo "wrote $dst"
                    # Assert PRESENCE of an expected source, not merely absence of a bad one: a
                    # truncated or malformed file would pass an absence-only check.
                    if ! grep -q 'key="dotnet-public"' "$dst"; then
                      echo "generated NuGet.config does not name dotnet-public - refusing" >&2; exit 1
                    fi
                    if grep -q 'api\.nuget\.org' "$dst"; then
                      echo "generated NuGet.config names api.nuget.org - refusing" >&2; exit 1
                    fi
                    grep -o 'key="[^"]*"' "$dst" | head -20
                  displayName: Provide a NuGet.config to scaffolded test projects
                  condition: succeeded()

                - pwsh: ./eng/prepare-test-console.ps1 -Configuration Release
                  displayName: Use the vstest.console this build produced
                  condition: succeeded()

                - script: ./test.sh
                    --configuration Release
                    --ci
                    --integrationTest
                    --performanceTest
                  name: Test
                  displayName: Test
                  env:
                    DOTNET_ROOT: $(Build.SourcesDirectory)/.dotnet
                    VSTEST_CONSOLE_PATH: $(_LocalVSTestConsolePath)

                # The test results folder is not produced when the job fails before any test runs,
                # and publishing a missing path would report a second, misleading failure.
                - pwsh: |
                    $dir = "$(Build.SourcesDirectory)/artifacts/TestResults/Release"
                    $hasFiles = (Test-Path -LiteralPath $dir) -and (@(Get-ChildItem -LiteralPath $dir -File -Recurse -ErrorAction SilentlyContinue).Count -gt 0)
                    Write-Host "##vso[task.setvariable variable=HasTestResults]$($hasFiles.ToString().ToLowerInvariant())"
                  displayName: 'Check for Test Results folders'
                  condition: failed()

                # This step is only helpful for diagnosing some issues with vstest/test host that would not appear
                # through the console or trx
                - task: 1ES.PublishBuildArtifacts@1
                  displayName: 'Publish Test Results folders'
                  inputs:
                    PathtoPublish: '$(Build.SourcesDirectory)/artifacts/TestResults/Release'
                    ArtifactName: TestResults
                  condition: and(failed(), eq(variables['HasTestResults'], 'true'))

          - job: Publish
            # DROP RUN. The internal VS drop requires a path label stating what these artifacts
            # are - which it now does. The temporary condition: false
            # that separated the two experiments from the delivery has served its purpose and is
            # removed.
            #
            # Signing is answered: build 3063018 signed for real with ConnectedPMEServiceName alone,
            # Round 0 556 files and Round 1 22 files, matching production 2781732 exactly.
            #
            # There is no approval or environment check between macOS and this job. Once this run is
            # queued and Windows, linux and macOS succeed, the drop happens. That is intended.
            #
            # Verified on the RESOLVED pipeline, not the checked-in file: 4,206 lines expanded via
            # the preview API, zero matches for nuget.org, api.nuget.org, /public/_packaging,
            # dotnet-tools, test-tools, dotnet10, dotnet11 and github releases. 41 publish-shaped
            # tasks, all internal ADO artifact publishing, plus this one VS drop.
            dependsOn:
              - ${{ each pool in parameters.otherOsPools }}:
                - ${{ pool.os }}
            pool:
                name: $(DncEngInternalBuildPool)
                image: windows.vs2026preview.scout.amd64
                os: windows
            steps:
              # The template job needs a log, otherwise it writes a warning. We can disable log uploading only for
              # the whole stage, which is not what we want to do. So we write an empty file instead.
              - pwsh: 'New-Item -Type file -Force "$(Build.SourcesDirectory)/artifacts/log/Release/empty.log"'
                name: 'Add_empty_logfile'
              # Download the built packages into local package source, as if we built them on this machine.
              - task: DownloadPipelineArtifact@2
                displayName: Download Package Artifacts
                inputs:
                  artifactName: PackageArtifacts
                  targetPath: '$(Build.SourcesDirectory)/artifacts/packages/Release/Shipping'

              - task: DownloadPipelineArtifact@2
                displayName: Download VSSetup Artifacts
                inputs:
                  artifactName: VSSetupArtifacts
                  targetPath: '$(Build.SourcesDirectory)/artifacts/VSSetup/Release'
              - task: AzureCLI@2
                displayName: Get DevDiv Drop Access Token
                inputs:
                  azureSubscription: 'dnceng-devdiv-drop-rw-code-rw-wif'
                  scriptType: pscore
                  scriptLocation: inlineScript
                  inlineScript: |
                    $token = az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv
                    Write-Host "##vso[task.setvariable variable=_DevDivDropAccessToken;issecret=true]$token"
                condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

              # WARNING LABEL IN THE PATH, NOT DECORATION. The drop task below exposes no annotation
              # input, so the drop path is the only place a warning about these artifacts can live.
              #
              # These artifacts are REAL-SIGNED. Build 3062904 signed 556 + 22 files with production
              # certificates, so every binary here carries a valid Microsoft signature and a
              # signature check CANNOT distinguish them from genuinely shipped bits. They are a
              # rebuild of a 2024 servicing line on modern infrastructure, produced to prove the
              # pipeline works. They were never released and must never be shipped or inserted.
              #
              # The label previously read 'testsigned-', which was true when signing was test-only
              # and became FALSE the moment real signing succeeded. A false label on a real-signed
              # artifact is worse than an over-cautious one, because it invites reuse by someone who
              # believes the signature is not real.
              #
              # Use the same canonical internal drop variable as the build's manifest URLs.
              - task: 1ES.MicroBuildVstsDrop@1
                displayName: Upload VSTS Drop
                inputs:
                  dropName: $(VisualStudioDropName)
                  dropFolder: 'artifacts\VSSetup\Release\Insertion'
                  accessToken: $(_DevDivDropAccessToken)
                condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

              - task: 1ES.PublishBuildArtifacts@1
                displayName: Publish Artifact VSSetup
                inputs:
                  PathtoPublish: 'artifacts\VSSetup\Release'
                  ArtifactName: 'VSSetup'
                condition: succeeded()

      - ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
        - template: /eng/common/templates-official/job/onelocbuild.yml@self
          parameters:
            GitHubOrg: microsoft
