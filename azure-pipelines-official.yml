            #   VerifyThatInvalidIdentifierNamesAreParsed
            #     GetTestAsset: Path not found: ...test\TestAssets\CILProject\bin\Release\net451\CILProject.dll
            #
            # which is 1 of the 6 and sits in a DIFFERENT assembly from the other 5, so splitting the
