# Internal validation pipeline for the 16.11 servicing line.
#
# The servicing validation pipeline reads this file. This is NOT main's official pipeline or
# a release pipeline. It builds, real-signs, and delivers to two internal destinations - see below.
# Shape copied from the 15.9 servicing pipeline rather than derived, so the three servicing
# lines fail and pass in the same places.
#
# ---------------------------------------------------------------------------------------------
# WHY THIS EXTENDS THE OFFICIAL TEMPLATE, AND WHY THAT IS STILL SAFE
#
# Extending Official does not by itself add a delivery route. The template SUPPLIES tasks; it does
# not INVOKE them. Every publishing route in main's pipeline comes from tasks written explicitly in
# main's own YAML inside a "- job: Publish" that this file does not contain, and that remains true.
#
# What this file DOES invoke is two 1ES templateContext outputs - a microBuildVstsDrop and a nuget
# push - declared explicitly below with literal internal destinations. So the safety property is no
# longer "nothing delivers"; it is that every delivery is named in this file, is internal, and is
# gated on succeeded(). Anything not named here still does not happen.
# ---------------------------------------------------------------------------------------------
# WHAT THIS PIPELINE DELIVERS, AND WHERE
#
# It builds, packages, REAL-SIGNS, and then delivers to exactly two internal destinations. This
# section previously read "no delivery of any kind" and listed the drop and feed push among the
# things deliberately left out. That was true until the real-signing work and is now false, so it
# is rewritten rather than amended: a delivery-surface description that is partly stale is more
# dangerous than none, because the stale half still reads as a guarantee.
#
# The two destinations, both internal, both literal:
#
#   1. VS drop  Products/internal/microsoft-vstest/realsigned-DO-NOT-SHIP-<branch>/<buildNumber>
#              carries the VSIX. Not the historical Products/DevDiv/microsoft/vstest path.
#   2. Feed     dnceng/internal general-testing-internal, visibility Organization, ZERO upstream
#              sources - so nothing pushed can be transitively re-served publicly.
#
# Both are gated on succeeded(), so a partial set never reaches either.
#
# STILL absent, and these are the routes that would make delivery public or authoritative:
#
#   - any package push to public/dotnet-tools, public/test-tools, nuget.org or the public dotnet
#     feeds. test-tools and dotnet-public are CONSUMED by this build and never written to.
#   - Generate-Manifest, which names a public dotnet-tools feed as a publishing Location. The
#     packaging step names its actions individually so this one cannot be reached.
#   - the post-build stage, which is what registers build assets against a Maestro channel.
#   - asset registration: the publish-build-assets job is gated by an or() with FOUR disjuncts, and
#     all four are false here. Naming only the flag is a weaker guarantee than it reads as, so the
#     whole condition is written out - eng/common/core-templates/jobs/jobs.yml:104:
#
#       or( eq(enablePublishBuildAssets, true),          <- false, explicit at the jobs.yml call
#           eq(artifacts.publish.manifests, 'true'),     <- no artifacts: is passed at all
#           ne(artifacts.publish.manifests, ''),         <- SAME field, ANY non-empty value includes it
#           eq(isAssetlessBuild, true) )                 <- jobs.yml:31 default false, never set here
#
#     The third disjunct is the one to watch: it fires on any non-empty manifests value, so setting
#     the flag false does NOT settle it by itself. enablePublishUsingPipelines is also set false at
#     line ~335, and it is INERT: measured, it has ZERO references in the entire eng/common template
#     set, while enablePublishBuildAssets has 2, enablePublishTestResults 3, publishAssetsImmediately
#     8 and enablePublishBuildArtifacts 11 - and a deliberately invented name scores 0 too, so the
#     query discriminates. Nothing in Arcade reads it, so setting it false guards nothing. It is a
#     leftover from an older Arcade, harmless to leave and misleading to cite.
#
#     TWO earlier versions of this comment were wrong about it in opposite directions: the first named
#     it as one of the conditions gating the publish job, the second corrected that to "not part of
#     this condition". Both implied it does something. It does not do anything.
#
#     Left in place rather than removed: deleting it is behaviour-neutral by the same measurement that
#     shows it inert, but it is still an edit to a pipeline that has never run on an agent, and the
#     measurement is worth more here than the tidier file.
#
#     Everything publish-named in eng/common hangs off this one job: publish-logs.yml is included
#     only by publish-build-assets.yml:214 and post-build.yml:233, and publish-using-darc.ps1 is
#     called only from publish-build-assets.yml:201 and post-build.yml:312. This pipeline references
#     post-build.yml zero times, so the whole chain is unreachable from one gate plus one absent
#     stage. source-index-stage1-publish.yml is separate and gated on enableSourceIndex, default
#     false, never set here.
#
# Localization runs here, unlike main, because satellites on this line are generated during the
# build rather than checked in. There is no isRTM parameter, because there is nothing for it to
# gate.
#
# trigger: none is deliberate. This runs only when queued by hand. main's official pipeline
# excludes rel/15.* and rel/16.* from its trigger, so 16.11 has never been built by it, and
# nothing here changes that for any other branch.
# ---------------------------------------------------------------------------------------------
# SCOPE: build, package, real-sign, and deliver to the two internal destinations named above.
#
# The test leg is IN, as of a9c263f04: Build -> Package -> Test -> Sign.
#
# This block previously read "The test leg is still out... Arcade's own -test path does not work on
# this line yet... MSB4057 x20... wiring it means porting main's eng/build.ps1 together with
# test.cmd, which is a separate change." Every clause of that was true when written and none of it
# was true by the time it was read: 8a0a4f1e9 had already set TestRunnerName=MSTest in
# eng/Versions.props and ported the wrapper with full -test support, so the runner targets resolve.
# Only this pipeline's invocation was missing.
#
# A LEAD THAT IS NEVER RE-MEASURED EVENTUALLY BECOMES FALSE WITHOUT ANYONE EDITING IT. The reason
# was carried forward for three sessions with the qualifier "inherited, not re-measured", which is
# what kept it from being a plain false claim - but a qualifier buys time, it does not fix an entry.
#
# The existing -test pass runs unit tests. NormalAcceptanceTests separately runs both supported
# acceptance frameworks with the patched runner; Smoke, Performance and *PlatformTests are unchanged.
#
# Verified locally on this branch before queueing:
#   eng\build.ps1 -restore -build -ci -warnAsError 0 -configuration Release
#     restore 0 errors, build 0 errors, with NU1603 promoted to an explicit error so package
#     substitution cannot hide behind -warnAsError 0. The WRAPPER, not eng\common\Build.ps1: the
#     localization phase lives there and packaging fails without it.
#   scripts\build.ps1 -Steps Publish -Actions Publish-Package | Create-VsixPackage | Create-NugetPackages
#     Publish-Package 0, 16 staged directories. Create-VsixPackage 0, producing TestPlatform.vsix,
#     16,040,410 bytes, 450 entries, 13 locales. Create-NugetPackages 0, 11 of 11.
#     The VSIX builds on a developer machine now. It never needed a Visual Studio that was missing;
#     it needed .NET Framework 4.6 targeting, which no longer exists anywhere, and a VSSDK whose
#     targets and VsixUtil.exe come from the same release.
#   eng\common\build.ps1 -restore -sign
#     11 of 11 produced packages resolved into ItemsToSign, 0 either way, all carrying
#     Certificate='NuGet', plus TestPlatform.vsix. Dry run locally, because there is no
#     OfficialBuildId there.
# ---------------------------------------------------------------------------------------------

# yyyymmdd.r, which is the shape Arcade's OfficialBuildId expects. The build's OWN date is used
# rather than a reconstruction of 2021: nothing recoverable was ever stamped by Arcade on this
# line, a 2021 date would be a false claim about when these bytes were produced, it would sort
# before every other build in any build-id ordering, and - the strongest reason - a package whose
# version string is indistinguishable from the real shipped one is a non-shipping artifact
# impersonating a shipped artifact.
name: $(Date:yyyyMMdd)$(Rev:.r)

# A merge into this line's servicing branch must build, and until now nothing made it.
# The branch policy covers the pull request; this covers what lands after it. Azure DevOps
# reads this file from the branch that was pushed, so internal/rel/* can only ever select
# this branch's own servicing line.
trigger:
  branches:
    include:
    - internal/rel/*
pr: none

variables:
  # Defines DncEngInternalBuildPool. Without this import the pool name stays the literal
  # text "$(DncEngInternalBuildPool)" and the run fails before any job starts.
  - template: /eng/common/templates-official/variables/pool-providers.yml@self
  - name: _TeamName
    value: TestPlatformTeam

  # _RunAsInternal and _RunAsPublic used to be declared here. They were read by nothing - measured
  # as zero references across eng/common and the whole repo - and _RunAsPublic: True sat next to
  # the signing configuration saying the opposite of what the build does. The real control is the
  # runAsPublic TEMPLATE PARAMETER, which core-templates/jobs/jobs.yml defaults to false and this
  # file does not override. A dead variable that reads as a decision is worse than no variable.

  # REAL signing. Certificates are real and the signatures are trusted for shipping.
  #
  # Sign.proj rejects any DotNetSignType other than 'real', 'test' or empty, and the MicroBuild
  # plugin only installs when _SignType is 'real' or 'test', so this value is load-bearing twice.
  #
  # It also forces microbuildUseESRP below. install-microbuild.yml validates the pair and FAILS the
  # build when SignType is real while ESRP is disabled, rather than silently downgrading to a
  # signature nobody would trust - so the two settings are one decision, not two.
  - name: _SignType
    value: real
  # PULL REQUEST VALIDATION, the same override 18.12 uses. A pull request build has no ESRP
  # credentials, so the MicroBuild plugin signs nothing and Arcade's own post-sign verification then
  # fails the build - measured on 3076704:
  #   Sign.proj(74,5): error : Nuget package Microsoft.CodeCoverage.16.11.1-hotfix-...nupkg is not
  #                            signed properly.
  #   Sign.proj(74,5): error : PE file ...\datacollector.exe is not signed properly.
  # Not a flake and not fixable by a rerun: a pull request build must not sign at all.
  #
  # THIS CONDITIONAL IS COMPLETE, verified rather than assumed. _Sign is read only by _SignArgs, and
  # $(_SignArgs) has exactly ONE consumer on this branch - the Sign step - which invokes
  # eng\common\Build.ps1 with -sign and then appends $(_SignArgs). build.ps1 turns -sign into
  # /p:Sign=True and appends @properties AFTER it, so /p:Sign from _SignArgs is last and wins, and
  # the Sign target is skipped along with its verification. Same mechanism, same ordering dependency
  # as 18.12.
  #
  # _SignType stays real. The gate above refuses to sign unless it reads real through both the macro
  # and the environment; a pull request build satisfies that by not signing, not by claiming a
  # different type. Non-pull-request keeps the former value exactly.
  - ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
    - name: _Sign
      value: false
  - ${{ if ne(variables['Build.Reason'], 'PullRequest') }}:
    - name: _Sign
      value: true
  - name: _SignArgs
    value: /p:DotNetSignType=$(_SignType) /p:TeamName=$(_TeamName) /p:Sign=$(_Sign)

  # Passed ONLY to the signing step, deliberately. Arcade sets OfficialBuild=true whenever
  # OfficialBuildId is non-empty, and Sign.proj dry-runs unless OfficialBuild is true - so without
  # this, signing reports success and signs nothing. It is kept off the build step because on this
  # line the build step is what determines assembly FileVersion, and off the packaging step because
  # the packaging step is what determines package version; neither may change as a side effect of
  # making signing real. Passing it to the signing invocation alone cannot affect either, because
  # that invocation produces no assembly and no package.
  #
  # SECOND-ORDER CONSEQUENCE, discovered afterwards and recorded here because THIS is where anyone
  # would change it:
  #
  # Because the build never receives OfficialBuildId, Arcade stamps its placeholder version
  # 42.42.42.42424 into every assembly, and that stamp is therefore IDENTICAL across builds. The
  # assembly version is a compilation INPUT, so two runs of this pipeline compile identical inputs
  # even at different build numbers - which is the only reason a determinism experiment is possible
  # on this line at all. Measured on 3063024 (20260901.7) vs 3063087 (20260901.12): same
  # FileVersion, 1,404 of 1,404 satellites MVID-stable, 226 IL-bearing assemblies MVID-unstable.
  #
  # MOVING OfficialBuildId ONTO THE BUILD STEP WOULD SILENTLY DESTROY THAT. Every assembly would
  # carry a build-derived version, every MVID would differ between runs for that reason alone, and
  # non-determinism would become indistinguishable from a version bump. The 17.14 line has exactly
  # that configuration and its 262 MVID differences are fully explained by it.
  #
  # There may be a good reason to move it later. Read this first, and if you do move it, record that
  # the determinism measurement is void rather than letting it stand as though it still held.
  #
  # A MEASURED CONSEQUENCE OF NOT MOVING IT, so the trade is stated rather than implied. Because
  # OfficialBuildId reaches Sign and not Build, this pipeline stamps TWO version suffixes into one
  # artifact. Measured on the VSIX delivered by 3064235: 186 files at 16.11.0-dev and 44 at
  # 16.11.0-ci, and all 230 carrying FileVersion 42.42.42.42424, so every one was compiled by that
  # build - none is a carried or restored component.
  #
  # THE -dev HALF NOW TRACKS THE COMPUTED VERSION. Since 57007ce7d the compiled group is stamped
  # 16.11.0-release-<yyyyMMdd>-<rev> instead of 16.11.0-dev; the copied group is unaffected, because
  # its version was baked in by whatever compiled it. Measured across the packages of 3064456:
  # 138 binaries at 16.11.0-release-20260902-42 and 87 at 16.11.0-ci, still 2 distinct values, still
  # not uniform. The SPLIT is the finding; the particular suffix on the left of it is not.
  #
  #   files scripts\build.ps1 COMPILES        -> -dev   from $VersionSuffix, scripts\build.ps1:23
  #   files it COPIES from Arcade's output    -> -ci    from ContinuousIntegrationBuild, eng\common\tools.ps1:814
  #
  # TRACED TO THE COPY SITES, so this is a cause rather than an inference from the version strings.
  # $env:TP_OUT_DIR is <root>\artifacts (scripts\build.ps1:98), so TP_OUT_DIR\bin\ is Arcade's
  # output layout, and every -ci file is Copy-Item'd out of it:
  #
  #   :594-598   the 8 testhost.<tfm>.exe      from artifacts\bin\testhost\
  #   :601-605   the 8 testhost.<tfm>.x86.exe  from artifacts\bin\testhost.x86\
  #   :768-789   BlameDataCollector + 13 locales, via Copy-Loc-Files
  #   :793-803   EventLogCollector  + 13 locales, via Copy-Loc-Files
  #
  # 2 collectors + 16 launchers = the 44 files in the VSIX. The negative half matters as much:
  # scripts\build.ps1 never compiles any of them - no dotnet build, no dotnet publish. Everything
  # else goes through Publish-PackageInternal / Publish-PackageWithRuntimeInternal with
  # -p:Version=$TPB_Version. So the -p:CIBuild value passed at :410 and :928 does not explain the
  # mixture, because neither invocation ever touches these files; Arcade compiled them during the
  # Build step and this script only relocates the bytes. ProductVersion is
  # AssemblyInformationalVersionAttribute, baked at compile time, so a copy cannot change it.
  #
  # THIS SITE LIST IS NOT COMPLETE, AND MUST NOT BE USED AS THE SCOPE OF A FIX. It was written from
  # the VSIX, where 44 files are -ci and all 44 are explained above. Across the PACKAGES the -ci
  # population is 87, and these five sites explain 75 of them. The residue is CoreUtilities,
  # PlatformAbstractions and Microsoft.VisualStudio.TestPlatform.ObjectModel in the net45,
  # netstandard1.0 and uap10.0 legs - and CoreUtilities is -ci in 4 legs while being -dev in 15
  # others, so the unit is the (PROJECT, TFM LEG) pair rather than the project or the leg.
  #
  # Two packages are entirely -ci and neither appears in the VSIX at all: Microsoft.TestPlatform.Build,
  # which supplies the MSBuild targets every `dotnet test` consumer executes, and
  # Microsoft.TestPlatform.AdapterUtilities. A census of the VSIX alone cannot see either.
  #
  # So the acceptance criterion for any fix is a POPULATION check - count distinct ProductVersion
  # values across first-party managed binaries and require exactly one - and NOT "the files at these
  # five sites now agree". A fix scoped to an enumeration inherits that enumeration's
  # incompleteness, and its verification would pass for the same reason the fix was wrong.
  #
  # The 44 are BlameDataCollector and EventLogCollector with 13 locales each, plus the 16 generated
  # testhost.net4XX[.x86].exe. The SHIPPED 16.11 VSIX carries the identical 230 files at ONE version,
  # 16.11.0-release-20210730-02, so this is a composition difference from shipped and not normal
  # variation - 17.14's shipped artifact is itself split across 22 versions, and a split there would
  # mean nothing.
  #
  # THREE FIXES EXIST, not one, and the cheap two do not touch OfficialBuildId:
  #
  #   A  OfficialBuildId -> the Build step         restamps EVERYTHING; the warning above applies
  #   B  scripts\build.ps1 -VersionSuffix ci       only the 186 change, to match the 44
  #   C  ContinuousIntegrationBuild=false on the   only the 44 change, to match the 186
  #      Arcade Build step
  #
  # B and C reconcile the two SUFFIX SOURCES, which is the actual disagreement, rather than
  # restamping against a shipped version. All three are deferred deliberately: even B and C alter
  # version strings on binaries whose alignment against the shipped 2021 packages has been measured,
  # which is a servicing-policy decision for whoever inserts servicing code. The cheapest useful
  # change is neither - it is that nothing in this pipeline currently REPORTS the split.
  - name: _OfficialBuildIdArgs
    value: /p:OfficialBuildId=$(Build.BuildNumber)

  # The directory the signing gate reads AND the directory published as ServicingTestResults. One
  # value used twice cannot disagree with itself.
  #
  # These were briefly two literals - the gate rooted at $(System.DefaultWorkingDirectory) and the
  # publish at $(Build.SourcesDirectory). Those two are equal on this pipeline today, which is
  # exactly what makes the divergence dangerous: it would not fail, it would silently publish a
  # different directory than the one the gate asserted on, and the artifact would still be present
  # and still look like evidence. 17.14 shipped the same shape in a .vsman drop path and had to fix
  # it after the two literals drifted apart.
  - name: _TestResultsDirectory
    value: $(Build.SourcesDirectory)/artifacts/TestResults/$(_BuildConfig)

  # This pipeline DOES upload a drop, as of the real-signing work: see the microBuildVstsDrop output
  # below. The name is a literal internal path and it states what the artifacts ARE.
  #
  # A drop labelled "testsigned" while holding real Microsoft-signed binaries would mislead
  # consumers. The name must describe the actual signed payload.
  #
  # DO-NOT-SHIP is in the name rather than in a comment because the name is the only part that
  # travels with the artifacts.
  - name: VisualStudioDropName
    value: Products/internal/microsoft-vstest/realsigned-DO-NOT-SHIP-$(Build.SourceBranchName)/$(Build.BuildNumber)

  - name: _InternalBuildArgs
    # WAS ' ' - a single space, i.e. EMPTY - and that emptiness was the whole defect. The Build
    # step below expands $(_InternalBuildArgs) and therefore passed NOTHING to Arcade, so Arcade
    # built as a non-official build and stamped its non-official placeholder.
    #
    # MEASURED ON THIS LINE'S OWN BUILD 3066837, not carried over from 15.9:
    #   1,971 versioned binaries in ServicingPackages_Release
    #     308 on FileVersion 42.42.42.42424    <- Arcade's non-official placeholder
    #   1,324 on FileVersion 16.1100.26.45420  <- the group the Package step restamps
    # The 308 are exactly the binaries Copy-Item'd out of Arcade's Build output; a copy cannot
    # restamp what it copies, so they can only be fixed at the step that produced them.
    #
    # AND MEASURED AGAINST SHIPPED 16.11.0 rather than assumed: the shipped packages contain the
    # SAME 1,971-binary population, carry the placeholder on ZERO of them, and hold 1,632 on one
    # uniform ProductVersion 16.11.0 - which is exactly our 1,324 + 308. So the split is a real
    # divergence from shipped and not normal variation.
    #
    # 15.9 is the control, not a guess: its Build step is the same shape and expands the same
    # variable, but there the variable is NON-EMPTY and carries this exact argument - and 15.9's
    # placeholder count is 0 on build 3066816.
    value: /p:OfficialBuildId=$(Build.BuildNumber)

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    sdl:
      policheck:
        enabled: true
      # TSA upload is off. It requires .config/tsaoptions.json, which main carries and this 2021
      # branch does not, and its purpose is to file security bugs into a tracking area. This is a
      # validation build that is meant to have no external side effects, so filing
      # bugs from it would be wrong even if the config were present. Guardian itself still runs
      # and its results stay attached to the build record.
      # When this line gets a real production pipeline, take main's .config/tsaoptions.json rather
      # than leaving this disabled.
      tsa:
        enabled: false
    pool:
      # Internal pool image carries no .open suffix. The public pipeline in azure-pipelines.yml
      # uses the same image family WITH .open; crossing the two fails pool resolution, which
      # presents as a 0-second run with no timeline records.
      name: $(DncEngInternalBuildPool)
      image: windows.vs2026preview.scout.amd64
      os: windows
    settings:
      networkIsolationPolicy: Permissive,CFSClean
    customBuildTags:
    - servicing-validation
    - do-not-publish
    stages:
    - stage: build
      displayName: Build
      jobs:

      - template: /eng/common/templates-official/jobs/jobs.yml@self
        parameters:
          enableMicrobuild: true
          # Real signing needs the ESRP service connection, and install-microbuild.yml enforces that:
          # microbuildUseESRP false with _SignType real is a hard build failure, by design, so this
          # is forced by _SignType rather than chosen independently.
          #
          # Which service connection resolves is established BEFORE the run rather than read out of a
          # failure. The template picks 6cc74545-... only when System.TeamProject is DevDiv; this
          # pipeline is dnceng/internal, so the else branch applies and
          # 248d384a-b39b-46e3-8ad5-c2c210d5e7ca is expected. Corroborated off a resolved job, not
          # off this file: NuGetAuthenticate@1 appears in build 3062199's timeline and its
          # compile-time condition requires System.TeamProject to be internal.
          microbuildUseESRP: true
          # Attaches files to the run so a private build can be inspected in place.
          # This is not feed delivery and it is not asset registration.
          enablePublishBuildArtifacts: true
          enablePublishBuildAssets: false
          enablePublishUsingPipelines: false
          # RESTORED, together, now that a test leg exists. Both values must move together: the
          # gate is an OR -
          #   ${{ if or( and(eq(enablePublishTestResults,'true'), eq(testResultsFormat,'')),
          #              eq(testResultsFormat,'vstest') ) }}
          # so setting the flag alone does nothing (measured: byte-identical expansion), and
          # clearing the format alone removes the step whatever the flag says.
          #
          # These were set to false/'' in 8fcd7199b because the pipeline ran no tests, and a
          # test-results publisher with condition: always() and continueOnError: true showed
          # GREEN on build 3063087 while publishing nothing - it cannot not-run and it cannot
          # fail, so there was no state of the world it distinguished.
          #
          # THAT REMAINS TRUE OF THE STEP ITSELF. It is safe to restore only because the verdict
          # is now taken from the ATTACHED TEST-RUN COUNT rather than from the step's colour:
          #   GET /_apis/test/runs?buildUri=vstfs:///Build/Build/<id>   -> count must be NON-ZERO
          # A green publish with zero attached runs means no test executed, whatever it looks
          # like on the build summary. Capture-DeliveryEvidence.ps1 asserts exactly that.
          enablePublishTestResults: true
          testResultsFormat: 'vstest'
          enableTelemetry: true
          # 16.11 predates source build.
          enableSourceBuild: false
          jobs:
          - job: Windows
            timeoutInMinutes: 120
            pool:
              name: $(DncEngInternalBuildPool)
              image: windows.vs2026preview.scout.amd64
              os: windows
            # Attach what this pipeline PRODUCES to the build record, so that "the pipeline produces
            # the artifacts" stops being a claim read out of a log and becomes a set that can be
            # downloaded and compared against the shipped baseline. Without this the run signs eleven
            # packages and a VSIX and then discards them.
            #
            # This is the ONLY thing on any of the three servicing lines that leaves a build agent,
            # and it is deliberately the least dangerous shape available: a pipeline artifact on the
            # build record. Not a feed, not a drop, not asset registration, no manifest - and
            # Generate-Manifest remains unreachable because the packaging step names its actions.
            #
            # The packages carry -dev, which is not cosmetic. Package version comes from $TPB_Version
            # in scripts\build\TestPlatform.Settings.targets and is independent of Arcade's
            # OfficialBuildId, so a downloaded artifact is self-labelling as a non-shipping build.
            #
            # The signatures are REAL Microsoft production signatures, not test signatures. That
            # sentence used to read "the signatures are test signatures for the same reason" and it
            # expired when _SignType became real. Measured on build 3063024: all 1,973 PE files carry
            # the same Authenticode signer subject as the corresponding shipped 2021 file, against
            # 333 of 1,973 under test signing. So -dev in the version string is now the ONLY thing
            # distinguishing these artifacts from shippable ones, which is precisely why the drop
            # name below says DO-NOT-SHIP and why the feed is a testing feed.
            #
            # succeededOrFailed, not succeeded, and that is the point rather than a convenience: the
            # packaging leg currently stops at a payload that no feed can supply, and the artifacts
            # produced BEFORE it stops are exactly what has to be inspected to know how far the leg
            # got. An artifact published only on green would be empty on every run that has something
            # to teach. Whether a set is complete is answered by reading the set, which is reported
            # by name after every run, never by the presence of the artifact.
            templateContext:
              outputs:
              - output: pipelineArtifact
                displayName: Publish servicing packages to the build record
                targetPath: $(Build.SourcesDirectory)\artifacts\$(_BuildConfig)\packages
                artifactName: ServicingPackages_$(_BuildConfig)
                condition: succeededOrFailed()
              - output: pipelineArtifact
                displayName: Publish servicing VSIX to the build record
                targetPath: $(Build.SourcesDirectory)\artifacts\$(_BuildConfig)\VSIX
                artifactName: ServicingVsix_$(_BuildConfig)
                condition: succeededOrFailed()

              # 🛑 THE ARTIFACT NAME IS LOAD-BEARING AND MUST BE EXACTLY "VSSetup" - NO SUFFIX.
              # RoslynTools GetInsertableComponentBuildsAsync compares against the literal:
              #     var arcadeArtifactName = ArcadeInsertionArtifacts.ArtifactName;   // "VSSetup"
              #     if (artifacts.Any(a => a.Name == arcadeArtifactName || a.Name == legacyArtifactName))
              # and DISCARDS the build otherwise. Earlier insertion attempts did not reach a
              # manifest when the artifact name differed from VSSetup.
              # Publishing VSTest1714VSSetup instead of VSSetup is what already cost a week, so the
              # $(_BuildConfig) suffix every artifact above carries must NOT be added to this one.
              # succeeded() rather than succeededOrFailed(): the others are retained for diagnosis,
              # this one is a DELIVERY artifact and a failed run must not offer the insertion tool a
              # half-built component.
              # PULL REQUEST: not produced. The assemble step below is skipped in a pull request
              # build because there is nothing signed to stage, so there is no artifact to publish
              # and an empty one would look to the insertion tool exactly like a half-built
              # component. Non-pull-request behaviour is unchanged.
              - output: pipelineArtifact
                displayName: Publish Artifact VSSetup
                targetPath: $(Build.SourcesDirectory)\artifacts\VSSetup\$(_BuildConfig)
                artifactName: VSSetup
                condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

              # THE TEST RESULTS THE SIGNING GATE READS. Retained because the gate's INPUT was not.
              #
              # Assert-KnownTestFailures reads artifacts\TestResults\<config> in-job, decides whether
              # signing is authorised, and then the agent is recycled and the .trx files are gone.
              # Every other control on this line publishes what it asserted on; this one did not, so
              # the single decision that authorises SIGNING was the only one that could not be
              # re-examined afterwards.
              #
              # This was found by needing it: validating a change to the gate required a retained
              # result set, none existed for this line, and the only set on the machine turned out to
              # belong to 15.9 - which the gate cheerfully classified, because the tests share names
              # across the two lines. 15.9 publishes ServicingTestResults_<config>; this is the same
              # artifact under the same name so the two lines can be compared directly.
              #
              # succeededOrFailed for the same reason as the two above, and more sharply here: the
              # runs worth reading are precisely the ones where the gate BLOCKED.
              - output: pipelineArtifact
                displayName: Publish the test results the signing gate read
                targetPath: $(_TestResultsDirectory)
                artifactName: ServicingTestResults_$(_BuildConfig)
                condition: succeededOrFailed()

              - output: pipelineArtifact
                displayName: Publish normal acceptance results
                targetPath: $(Build.SourcesDirectory)\artifacts\AcceptanceTestResults\$(_BuildConfig)
                artifactName: NormalAcceptanceTestResults_$(_BuildConfig)
                condition: succeededOrFailed()

              # The binlog from "Build test assets", which is the only artefact that can settle why
              # CI reports MSB3644 x16 and 838 netstandard2.0 errors while an identical local run on
              # the pinned SDK reports zero of both. succeededOrFailed for the same reason as above:
              # the interesting run is the FAILING one, and that step carries continueOnError.
              - output: pipelineArtifact
                displayName: Publish the test-asset build binlog
                targetPath: $(Build.SourcesDirectory)/artifacts/log/$(_BuildConfig)
                artifactName: ServicingBuildLogs_$(_BuildConfig)
                condition: succeededOrFailed()

              # The VSIX drop and the package feed push. These are the first things on any of the
              # three servicing lines to leave the build record, so the reasoning is spelled out.
              #
              # condition: succeeded(), NOT succeededOrFailed(). The two pipeline artifacts above are
              # deliberately succeededOrFailed because a partial set is exactly what has to be read
              # when the packaging leg stops early. The opposite is true here: a drop or a feed is a
              # place other people look, and half a set published there is indistinguishable from a
              # complete one at the destination. Publishing a partial set to the build record is
              # evidence; publishing it to a feed is a lie with a URL.
              #
              # DESTINATION HONESTY. The drop name is a literal internal path containing
              # DO-NOT-SHIP - no variable that could expand somewhere else, no DevDiv segment. The
              # historical 2021 drop for this repo was Products/DevDiv/microsoft/vstest/<branch>/<id>
              # (still visible in scripts\write-release-notes.ps1); this deliberately does not reuse
              # it, because these artifacts are not that build and must not land where consumers of
              # that path look.
              #
              # THE FEED IS general-testing-internal, and the choice is measured rather than
              # conventional:
              #   - project dnceng/internal, visibility Organization. Not public. Read from the
              #     packaging API, not assumed from the name.
              #   - ZERO upstream sources. Nothing pushed here can be transitively re-served to a
              #     public feed. That is the property that matters for the never-publish-publicly
              #     rule, and it is a fact about the feed rather than about our intent.
              #   - it is named for testing, so its consumers expect experimental content.
              # dotnet-tools-internal and the dotnetN-internal transport feeds were rejected: real
              # product builds consume them, and an experimental servicing package appearing there
              # could be picked up by something that did not ask for an experiment.
              #
              # ⚠️ THE CLAIM BELOW WAS TRUE UNTIL 2026-09-07 AND IS NOW SUPERSEDED. It is kept
              # rather than deleted, because a reader who finds only the new text cannot tell that
              # the protection was deliberately given up rather than overlooked.
              #
              # WHAT IT SAID: every version this line produced carried a PRERELEASE SUFFIX -
              # 16.11.0-dev historically, 16.11.0-release-<yyyyMMdd>-<rev> since 57007ce7d - while
              # the shipped packages are plain 16.11.0. A prerelease sorts BELOW the release it
              # qualifies, so no push here could replace or outrank a real 16.11.0 on any feed
              # carrying both. The property was the SUFFIX, not any particular value of it.
              #
              # WHY IT NO LONGER HOLDS: the prefix moved 16.11.0 -> 16.11.1, so this line now
              # produces 16.11.1-release-<yyyyMMdd>-<rev>. That still sorts below a future real
              # 16.11.1, but it sorts ABOVE the shipped 16.11.0. The guarantee "cannot outrank what
              # shipped" is GONE, and it was load-bearing on a feed product builds consume.
              #
              # WHY IT WAS GIVEN UP, on purpose: 16.11.1 is the servicing target, and a package
              # that cannot outrank 16.11.0 also cannot SERVICE it. The protection and the goal
              # were mutually exclusive.
              #   Precedent: 15.9 has carried 15.9.3 against shipped 15.9.2 since 2026-09-04.
              #
              # WHAT STILL CONSTRAINS THIS: the `-release-<date>-<rev>` suffix remains, so these are
              # still PRERELEASE builds and a real 16.11.1 will outrank them. The drop stays in the
              # realsigned-DO-NOT-SHIP- namespace. Neither is a substitute for the property above.
              # 🛑 THE DROP MUST CARRY WHAT THE MANIFEST POINTS AT, so it is the Insertion folder
              # and not the raw VSIX folder. The generated .vsman gives every payload an absolute
              # url of the form
              #     https://vsdrop.corp.microsoft.com/file/v1/<dropName>;/<fileName>
              # so each payload has to sit at the ROOT of this drop. Pointing the drop at
              # artifacts\<cfg>\VSIX would resolve TestPlatform.vsix and then 404 on
              # ...V2.CLI_sbom.json, which the vsmanproj writes next to the manifest - and a missing
              # SBOM breaks drop GENERATION, not transmission, so it surfaces late and badly.
              # This is the shape 18.10 already uses and that RoslynTools already accepts:
              #     dropFolder: 'artifacts\VSSetup\Release\Insertion'
              # 17.14's pin defect was this same field pointing where the content was not, proven by
              # a control URL that stayed 404 across three consecutive builds.
              - output: microBuildVstsDrop
                displayName: Publish servicing VSIX to an internal VS drop
                dropFolder: $(Build.SourcesDirectory)\artifacts\VSSetup\$(_BuildConfig)\Insertion
                dropName: $(VisualStudioDropName)
                dropRetentionDays: 30
                accessToken: $(_DevDivDropAccessToken)
                condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
              - output: nuget
                displayName: Publish servicing packages to general-testing-internal
                packageParentPath: $(Build.SourcesDirectory)\artifacts\$(_BuildConfig)\packages
                # Symbols packages are excluded, matching main's push pattern.
                #
                # Found by diffing this pipeline's MECHANISM surface against main rather than by a
                # failure: main pushes '**/*.nupkg;!**/*.symbols.nupkg' and this pushed '*.nupkg'.
                #
                # It is a NO-OP TODAY and that is measured, not assumed: build 3063087 produced 11
                # .nupkg and 0 .symbols.nupkg, so the two patterns select the same 11 files. It is
                # committed anyway because the divergence is latent - the day this line starts
                # producing symbols packages, the unqualified pattern would publish debugging
                # symbols to a feed as an ordinary package, and nothing would report it as a change.
                packagesToPush: $(Build.SourcesDirectory)\artifacts\$(_BuildConfig)\packages\*.nupkg;!$(Build.SourcesDirectory)\artifacts\$(_BuildConfig)\packages\*.symbols.nupkg
                nuGetFeedType: internal
                # allowPackageConflicts: false, DELIBERATELY, and it used to be true.
                #
                # WHAT IT WAS FOR. This line used to push a FIXED version, 16.11.0-dev, on every
                # run, because the build is deliberately not an official build. A second delivering
                # run offered the same version with different bytes, the feed kept the first upload
                # and answered 409, and build 3064130 failed exactly that way with all 11 packages
                # already present and verified correct by a paged read-back. allowPackageConflicts
                # was set to true to keep that from failing the build.
                #
                # WHAT CHANGED. 57007ce7d computes 16.11.0-release-<yyyyMMdd>-<rev> from
                # Build.BuildNumber, matching the shape 16.11 actually shipped
                # (16.11.0-release-20210730-02). MEASURED on 3064456, the first run after that
                # change: 11 produced, 11 TRANSFERRED, 0 already present, 0 conflicts. The 409 case
                # did not arise at all, and cannot: no two builds share a build number.
                #
                # SO A CONFLICT NOW MEANS A FAULT. Either the suffix computation regressed to a
                # constant, or two builds share a build number. Both are faults, and true would
                # convert both into a silent success - the feed would hold ANOTHER build's packages
                # and the push would report that it had delivered THIS build's. false makes the
                # push itself refuse, which is the behaviour that was previously obtained by a
                # separate report step running beforehand.
                allowPackageConflicts: false
                publishVstsFeed: internal/general-testing-internal
                publishPackageMetadata: true
                condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
            strategy:
              matrix:
                Release:
                  _BuildConfig: Release
            steps:
            # EXPLICIT CHECKOUT WITH FULL HISTORY. This job previously declared no checkout, so it
            # inherited the shallow default. Build 3065069 then spent 13.4 minutes inside a run-time
            # `git fetch --unshallow` and was cancelled; the entire task log was one line.
            #
            # fetchDepth: 0 does not make the fetch cheaper. It moves it into the step designed to do
            # it, which reports progress, so the same cost stops presenting as an unexplained stall.
            # The delivering build 3065083 ran with this setting.
            - checkout: self
              fetchDepth: 0
              # persistCredentials, because the implicit default strips them and that half of the
              # default is not fixed by fetchDepth. 15.9's build 3065068 hung 31 MINUTES with zero
              # output when a `git fetch` ran without credentials and prompted; a prompt on a
              # non-interactive agent is indistinguishable from a slow network until the job times
              # out. Nothing in this file fetches today, so this is latent rather than live, and it
              # costs nothing to make a future fetch work instead of hang.
              persistCredentials: true

            - task: DotNetCoreCLI@2
              displayName: 'dotnet --info'
              inputs:
                command: custom
                custom: '--info'

            # THE PACKAGE VERSION SUFFIX MUST VARY PER BUILD, and it is computed here rather than
            # defaulted.
            #
            # scripts\build.ps1:23 defaults $VersionSuffix to the constant "dev", and a constant
            # version is the mechanical cause of the feed being frozen: every run after the first
            # offered 16.11.0-dev again, the feed kept the first upload and answered 409, and with
            # allowPackageConflicts set the push reported success having transferred nothing.
            # Eleven packages on the feed differ by SHA-256 from what the latest build produced.
            #
            # The SHAPE is taken from what this line actually shipped, not invented:
            #
            #   16.11.0-release-20210730-02      the shipped 16.11 packages and VSIX
            #   16.11.0-release-<yyyyMMdd>-<rev> this, from Build.BuildNumber's <date>.<rev>
            #
            # DO NOT HARMONISE THIS WITH THE OTHER SERVICING LINES. They deliberately differ:
            #
            #   16.11   release-<yyyyMMdd>-<rev>   matches 16.11's shipped release-20210730-02
            #   15.9    release-<yyMMdd>-<rev>     15.9 shipped bare, with no suffix at all
            #   17.14   release-26452-26           Arcade's own date encoding, matching 17.14's shipped shape
            #
            # Three different encodings, each matched to ITS OWN baseline. The requirement is that a
            # rebuilt artifact carries the same shape as what that line shipped - not that the three
            # lines agree with each other. Anyone comparing the three side by side will want to
            # unify them; unifying them would move at least two lines AWAY from their own shipped
            # form, which is the thing being validated.
            #
            # Computed in PowerShell rather than as a YAML expression on purpose: the revision needs
            # zero-padding to two digits to match the shipped form, which YAML expressions cannot do,
            # and a malformed suffix would be silent. It ASSERTS its own output instead - a build
            # number that does not split into date and revision fails the step rather than producing
            # a version nobody notices is wrong.
            #
            # OfficialBuildId is NOT moved. It stays on the Sign invocation only, so the determinism
            # measurement recorded in the variables block is unaffected: the package version is
            # composed by scripts\build.ps1:149 from this suffix and never passes through Arcade's
            # version generator, so no build-id component and no +commit metadata can appear.
            #
            # scripts\build.ps1:167 rewrites <NETTestSdkVersion> in
            # scripts\build\TestPlatform.Dependencies.props from the computed version on every run,
            # so the test assets follow this automatically. The value checked in there is the last
            # one written, not a pin.
            - pwsh: |
                $buildNumber = "$(Build.BuildNumber)"
                $parts = $buildNumber.Split('.')
                if ($parts.Length -lt 2) {
                  Write-Host "##vso[task.logissue type=error]Build.BuildNumber '$buildNumber' does not split into <date>.<revision>."
                  Write-Host 'Blocking. A malformed version suffix would ship silently.'
                  exit 1
                }
                $date = $parts[0]
                $rev = ([int]$parts[1]).ToString('00')
                $suffix = "hotfix-$date-$rev"
                if ($suffix -notmatch '^hotfix-\d{8}-\d{2,}$') {
                  Write-Host "##vso[task.logissue type=error]Computed suffix '$suffix' does not match the shipped shape hotfix-<yyyyMMdd>-<rev>."
                  exit 1
                }
                Write-Host "Build.BuildNumber : $buildNumber"
                Write-Host "version suffix    : $suffix"
                Write-Host "shipped 16.11 was : release-20210730-02"
                Write-Host "##vso[task.setvariable variable=_ServicingVersionSuffix]$suffix"
                # THE FULL VERSION, for the Build step. The Package step composes its own version
                # from the SUFFIX above, so the two steps would otherwise label the same product
                # differently - and they measurably did:
                #
                #   1324 compiled by Package   ProductVersion 16.11.0-release-<yyyyMMdd>-<rev>
                #    308 copied from Build     ProductVersion 16.11.0-ci
                #
                # Those 1,632 are EXACTLY the 1,632 that shipped 16.11.0 carries on ONE uniform
                # ProductVersion, so the split is the divergence and uniformity is the target.
                # Giving Build the same version the Package step will use is what closes it.
                #
                # The prefix is READ from the file that defines it rather than repeated here, so
                # this cannot drift from TPVersionPrefix. An empty prefix would silently produce
                # "-release-<date>-<rev>", which packs and signs happily and is wrong everywhere
                # downstream, so it stops the build instead.
                $prefix = ([xml](Get-Content scripts\build\TestPlatform.Settings.targets)).Project.PropertyGroup.TPVersionPrefix | Where-Object { $_ }
                if (-not $prefix) {
                  Write-Host "##vso[task.logissue type=error]TPVersionPrefix is empty in scripts\build\TestPlatform.Settings.targets, so the full version cannot be composed."
                  exit 1
                }
                $full = "$prefix-$suffix"
                Write-Host "version prefix    : $prefix"
                Write-Host "full version      : $full"
                Write-Host "##vso[task.setvariable variable=_ServicingVersion]$full"
              name: ComputeVersionSuffix
              displayName: Compute the package version suffix

            # eng\build.ps1, NOT eng\common\Build.ps1. The repo wrapper is where the localization
            # phase lives, and it is not optional here.
            #
            # Satellites on this branch are not compiled from anything checked in: fmdev.xlftool
            # writes culture .resx out of the checked-in .xlf, and only a build that has both those
            # .resx and /p:LocalizedBuild=true embeds them. eng\build.ps1 does the generation and
            # sets the property together, splitting Arcade's single call into restore, generate,
            # build - because the .resx must exist before the build that embeds them is evaluated.
            #
            # Calling eng\common\Build.ps1 directly skips both. Measured on build 3062169: the build
            # succeeded with 0 errors and 133 assemblies, and packaging then failed at the first
            # Move-Loc-Files call because no satellite existed anywhere. A build leg that is green
            # and a packaging leg that is not is exactly what that looks like from the outside.
            #
            # -prepareMachine is correct here and only here: the CI agent is exclusive. Never pass
            # it on a shared developer machine, where Arcade's Stop-Processes kills every dotnet,
            # msbuild and vbcscompiler process on the box.
            #
            # warnAsError is passed as 0, not $false: through cmd and the PowerShell task the token
            # arrives as the string "False" and the [bool] parameter rejects it. The switch is off
            # because this is 2021 source compiled by a current Roslyn, and the
            # diagnostics are pre-existing style and XML-doc rules. NU1603 is promoted back to an
            # error in Directory.Build.props so package substitution is still caught.
            # -projects pins the build to TestPlatform.sln. Arcade builds every *.sln at the repo
            # root by default, and this repo has two: TestPlatform.sln and
            # TestPlatform_BuildFromSource.sln. Both contain the same shared projects, so Arcade
            # builds those projects twice concurrently and the two builds overwrite each other's
            # intermediate output:
            #
            #   MSB3554: Cannot write to the output file ...Resources.resources
            #            because it is being used by another process
            #
            # That is why the failures landed on projects with no duplicate .csproj, why they were
            # intermittent, and why they looked like machine contention. TestPlatform_BuildFromSource
            # .sln is 2018-era source-build infrastructure and source build is disabled on this
            # line, so excluding it costs nothing. The 15.9 line measured the same change at 10:07
            # serialised against 1:00 in parallel, same assembly count.
            # COVERAGE NOTE, AND THE QUESTION IT RAISED IS NOW ANSWERED.
            #
            # This step, Test (line ~1110) and Sign (line ~1210) are written in the SINGLE-LINE
            # `- powershell: <script> <args>` form, not the `pwsh: |` block form. An audit of "every
            # step that invokes a repo script and what follows it" was run against this pipeline and
            # reported 8 steps with 0 defects. That audit's matcher required the block form, so it
            # reached 13 of the 18 pwsh/powershell steps and NEVER EXAMINED THESE THREE - the build,
            # the tests and the signing. The partition was checked afterwards and is exhaustive and
            # disjoint: 13 block + 5 single-line = 18.
            #
            # THE PROPAGATION MECHANISM, MEASURED IN ALL SIX SHAPES. Three different mechanisms were
            # recorded here before this one, each replacing a wrong reason for a line that was
            # correct every time - which is precisely why nothing forced a re-measurement:
            #
            #   body raises the failure itself (throw or exit)   exit 1   propagates
            #   body CALLS a script that THROWS                  exit 1   propagates (terminating)
            #   body CALLS a script that EXITS non-zero          exit 0   LOST, last statement or not
            #   body CALLS, then exit $LASTEXITCODE              exit 1   forwarded
            #
            # It is not "inline versus file" and not "a trailing statement". A CALLED script's exit
            # code is not the calling file's; a called script's THROW is a terminating error and is.
            #
            # SO WHY THESE THREE ARE NOT EXPOSED, AND IT IS NOT THE EXIT CODE. eng\build.ps1 signals
            # build failure by EXIT, not throw - its only two throws are argument validation. Under
            # the rule above that code would be discarded. The build still goes red, by an INDEPENDENT
            # route: eng\common\tools.ps1 dot-sources pipeline-logging-functions.ps1 (tools.ps1:928)
            # and calls Write-PipelineTelemetryError 13 times; eng\common\build.ps1:201 calls it
            # immediately before ExitWithExitCode 1. That emits ##vso[task.logissue type=error], which
            # fails an Azure DevOps task regardless of the process exit code. Build 3063938 going red
            # from 292 NU1301 errors is explained without exit-code propagation.
            #
            # THE RESIDUE, STATED RATHER THAN ROUNDED OFF: this holds for failures routed through
            # Arcade's error helpers. A failure that exits non-zero WITHOUT calling them would still
            # be discarded here. That is narrower than "these steps are fine" and it is what was
            # measured.
            #
            # A literal grep for 'task.logissue' across eng/common returns ZERO for the very file
            # that emits it - Format-LoggingCommand builds the string from '##vso[' plus parts. That
            # zero was believed for several minutes. A narrow pattern's zero is not a measured zero.
            #
            # /p:Version BELOW - and note it is passed as an ARGUMENT, not written as a YAML comment
            # inside the argument list. This is a multi-line plain scalar, so a '#' line here would
            # be part of the STRING and would reach PowerShell literally, not be stripped as a
            # comment. Every explanation therefore lives above the step.
            #
            # WHY IT IS HERE: 308 binaries reach the packages by Copy-Item straight out of this
            # step's output and are never republished, so whatever THIS step stamps is what ships
            # for them. Measured on 3066837: they carried ProductVersion 16.11.0-ci while the 1,324
            # the Package step compiles carried 16.11.0-release-<yyyyMMdd>-<rev>. Shipped 16.11.0
            # carries ONE uniform ProductVersion across exactly those same 1,632 binaries, so the
            # split is the divergence.
            #
            # A command-line /p: is a GLOBAL property and beats every <Version> assignment in every
            # targets file, so this is not a race with Arcade's version generator. The repo's own
            # scripts\build\TestPlatform.Settings.targets:13 already declares
            # <Version Condition="'$(Version)' == ''"> - i.e. it explicitly yields to an
            # externally supplied Version - so this is the supported entry point, not a hack.
            #
            # This is 15.9's VERIFIED shape, ported as a MECHANISM and not as code: on that line the
            # same hoist-then-/p:Version took first-party ProductVersion values from 2 to 1. The
            # SUFFIX ENCODING is deliberately NOT ported - 15.9 uses release-<yyMMdd>-<rev> and this
            # line uses release-<yyyyMMdd>-<rev>, each matching its OWN shipped shape.
            - powershell: eng\build.ps1
                -configuration $(_BuildConfig)
                -restore
                -build
                -ci
                -prepareMachine
                -warnAsError 0
                -projects $(Build.SourcesDirectory)\TestPlatform.sln
                /p:Version=$(_ServicingVersion)
                $(_InternalBuildArgs)
              name: Build
              displayName: Build
              env:
                # PAIRED WITH _InternalBuildArgs ABOVE - these two must move together or the second
                # silently undoes the first. Setting OfficialBuildId turns on
                # SourceControlInformationFeatureSupported, and
                # Microsoft.NET.GenerateAssemblyInfo.targets then appends SourceRevisionId to
                # InformationalVersion, which IS ProductVersion. On 15.9 that same enabling hit
                # 1,205 assemblies and was a SECOND divergence from completion bar (f), where
                # FileVersion is the ONE approved divergence.
                #
                # THE NUMBER THIS PROTECTS, measured on both sides rather than assumed:
                #   shipped 16.11.0        105 binaries carry a +<sha> ProductVersion
                #   our build 3066837      105 binaries carry a +<sha> ProductVersion
                # They already MATCH, and all 105 are third-party. So +sha is NOT a divergence on
                # this line and this variable exists to keep it that way. If a later build shows
                # +sha above 105, this env var did not reach the step.
                #
                # Quoted so it reaches MSBuild as a literal string.
                IncludeSourceRevisionInInformationalVersion: 'false'

            # pwsh, NOT powershell. An Azure DevOps "- powershell:" step runs Windows PowerShell,
            # and Assert-UapCoreUtilities - the check that proves the staged uap10.0 CoreUtilities
            # is really the uap10.0 build - needs System.Reflection.Metadata, which PowerShell 7 has
            # and Windows PowerShell 5.1 on .NET Framework does not. Measured: as a "- powershell:"
            # step this dies with "Cannot find type PEReader" inside a correctness control.
            #
            # The actions are named individually rather than running -Steps Restore,Publish as
            # groups, and that is required work rather than tidiness: the Publish group also
            # contains Generate-Manifest, which passes a public dotnet-tools feed URL as a
            # publishing Location, and Copy-PackageIntoStaticDirectory. Neither may ever run here.
            # Naming actions cannot reorder them - the dispatcher owns the order - so this is a
            # subset of the shipped sequence and nothing else.
            #
            # Restore-Package is in the list because the agent needs it and this machine did not.
            # It restores src\package\external\external.csproj into the repo-local packages\ folder,
            # which about thirty payload copy sites read by versioned path: TraceDataCollector, the
            # Coverage.* trees, QualityTools, CUIT, Intellitrace, the Dia COM components, vswhere
            # and nuget.exe itself. A developer machine has that folder populated from earlier work;
            # a clean agent does not, and the packages would come out quietly short.
            #
            # Install-DotNetCli is NOT in the list and must not be. It downloads dotnet-install.ps1
            # from raw.githubusercontent.com/dotnet/cli/master, archived years ago, and asks it for
            # channel release/6.0.1xx-preview1. Get-DotNetPath falls back to the .dotnet that the
            # Arcade restore above installs from global.json.
            #
            # Create-VsixPackage is expected to SUCCEED here, and that is the difference between
            # this agent and the developer machine. Locally it stops at Locate-VsInstallPath for
            # want of Microsoft.VisualStudio.Component.VSSDK. Its first ~80 lines are pure payload
            # copying into the full-CLR package directory, proven by deleting the first and the last
            # of those copies and watching both return, so skipping the function is not an option:
            # it would silently drop hundreds of shipped payload files.
            - pwsh: |
                # THE VSIX VERSION IS A THIRD SENTINEL, AND IT IS THE SAME DEFECT AS
                # FileVersion 42.42.42.42424 ONE LEVEL OVER. Ported from 15.9, where it was
                # found first on 2026-09-07.
                #
                # scripts/build.ps1 declares  [System.String] $BuildNumber = "20991231-99"
                # and Update-VsixVersion composes the VSIX manifest version as
                #   <Version>.<yyyyMMdd><rev>   from  $BuildNumber.Split("-")
                # This step never passed -BuildNumber, so the default won and EVERY VSIX this
                # line has produced carries 16.11.0.2099123199 - including the one on the
                # internal VS drop from build 3066931. Shipped 16.11 for comparison is
                # 16.11.0.2021073002, a real 2021-07-30 date.
                #
                # 2099-12-31 sorts ABOVE every real build and VS's VSIX upgrade rules compare
                # exactly this field, so a VSIX stamped 2099 is never superseded by a genuine
                # later servicing VSIX.
                #
                # The separator and the padding both matter, and both fail SILENTLY:
                #   ADO gives "20260904.26" with a DOT, and Split("-") returns one element, so
                #     the Length -ige 2 test fails and NO suffix is appended at all.
                #   ADO's first build of a day is "20260907.1", so an unconverted revision is a
                #     single digit and gives nine, where every shipped VSIX carries ten.
                $parts = "$(Build.BuildNumber)" -split '\.'
                if ($parts.Count -lt 2) { throw "BuildNumber '$(Build.BuildNumber)' has no revision part. Update-VsixVersion would fall back to the 20991231-99 sentinel and stamp a VSIX that no later build can supersede." }
                $bn = "{0}-{1}" -f $parts[0], ([int]$parts[1]).ToString('00')
                if ($bn -notmatch '^\d{8}-\d{2,}$') { throw "BuildNumber '$bn' is not <yyyyMMdd>-<rev>. Update-VsixVersion would fall back to the 20991231-99 sentinel." }
                Write-Host "VSIX-VERSION build number       : $bn"

                ./scripts/build.ps1 `
                  -Configuration $(_BuildConfig) `
                  -VersionSuffix $(_ServicingVersionSuffix) `
                  -BuildNumber $bn `
                  -Steps Restore,Publish `
                  -Actions Restore-Package,Restore-FakesPayload,Publish-Package,Create-VsixPackage,Create-NugetPackages,Copy-PackageIntoStaticDirectory
              name: Package
              displayName: Package
              # PORTED FROM 15.9, WHERE IT IS ALREADY VERIFIED. On that line the same two variables
              # on this same step took FileVersion placeholders 89 -> 0 (build 3066572) and then the
              # +sha suffix 1207 -> 2 (build 3066724). This is not a speculative port.
              #
              # An env var rather than /p:, because scripts\build.ps1 has no property passthrough.
              # MSBuild reads environment variables as properties, and nothing in this repo assigns
              # OfficialBuildId, so there is nothing for it to collide with.
              #
              # WHY IT IS NEEDED HERE, measured on THIS line's own build 3066640 rather than carried
              # over from 15.9 or from the older 3064235 that an earlier note used:
              #
              #   1,973 versioned binaries in ServicingPackages_Release
              #   1,632 on FileVersion 42.42.42.42424      <- Arcade's non-official placeholder
              #     105 ProductVersion +sha                <- ALL third-party, none first-party
              #
              # The placeholder population is EXACTLY the two first-party ProductVersion groups,
              # with no overlap either way:
              #
              #     16.11.0-release-20260904-15   1324 total   1324 placeholder   compiled HERE
              #     16.11.0-ci                     308 total    308 placeholder   COPIED from Arcade
              #
              # 🛑 PREDICTION, STATED BEFORE THE BUILD SO IT CAN FALSIFY THIS CHANGE. Verify by the
              # number, never by the build colour:
              #
              #     placeholder   1632 -> 308      the 1,324 compiled group moves, the copied 308 CANNOT
              #     first-party +sha   0 ->   0      suppressed by the variable below, as on 15.9
              #     ProductVersion split          unchanged: still 1324 -release / 308 -ci
              #
              # If the placeholder stays at 1632 this never reached the compile and is INERT - do not
              # record it as fixed on the strength of a green build. If it goes to 0, that is ALSO
              # wrong and must be explained, because the 308 are Copy-Item'd out of Arcade's Build
              # output (traced to the five copy sites listed on _OfficialBuildIdArgs above) and a copy
              # cannot restamp what it copies.
              #
              # THE 308 ARE A KNOWN, STATED REMAINDER, not an oversight. Clearing them needs
              # OfficialBuildId on the ARCADE BUILD step, which is a SEPARATE change with its own
              # consequences - it also moves those binaries off the 16.11.0-ci suffix, and that suffix
              # alignment against the shipped 2021 packages has been measured. One change, one
              # countable population, one build.
              #
              # ⚠️ THE DETERMINISM MEASUREMENT ON _OfficialBuildIdArgs IS NOW VOID FOR THE COMPILED
              # GROUP, and that comment asks explicitly to be told rather than left standing. It read
              # 1,404 of 1,404 satellites MVID-stable across 3063024 vs 3063087, and it held only
              # because the constant placeholder made the compilation inputs identical between runs.
              # These 1,324 now carry a build-derived FileVersion, so their MVIDs will differ between
              # builds for that reason alone. The 308 copied binaries are unaffected and remain
              # comparable. Any future determinism run must exclude the compiled group or re-baseline.
              env:
                # ProductVersion must NOT gain a +<sha> suffix. Setting OfficialBuildId turns on
                # SourceControlInformationFeatureSupported, and
                # Microsoft.NET.GenerateAssemblyInfo.targets:64 then appends SourceRevisionId to
                # InformationalVersion - which is ProductVersion. On 15.9 that hit 1,205 assemblies
                # and was a SECOND divergence from completion bar (f), where FileVersion is the ONE
                # approved one. Quoted so it reaches MSBuild as a literal string.
                IncludeSourceRevisionInInformationalVersion: 'false'
                OfficialBuildId: $(Build.BuildNumber)

            # PLACEHOLDER GATE FOR THE VSIX MANIFEST VERSION. Ported from 15.9.
            #
            # eng\Verify-LineAF.ps1 already fails a build on FileVersion 42.42.42.42424 and did
            # NOT catch 16.11.0.2099123199, because it scans ASSEMBLY versions and a VSIX manifest
            # version is not one. The guard existed and the sentinel walked past it, which is why
            # this check sits where the artifact is produced rather than in that scanner.
            #
            # Placed before Sign deliberately. Signing a VSIX that can never be superseded yields
            # a correctly signed artifact that must not be published - worse than a failed build.
            - pwsh: |
                $vsixDir = "$(Build.SourcesDirectory)\artifacts\$(_BuildConfig)\VSIX"
                $vsixes = @(Get-ChildItem -LiteralPath $vsixDir -File -Filter '*.vsix' -ErrorAction SilentlyContinue)
                if ($vsixes.Count -eq 0) { throw "No .vsix in '$vsixDir'. Create-VsixPackage produced nothing and there is no version to check - that is the failure to report, not something to skip past." }
                Add-Type -AssemblyName System.IO.Compression.FileSystem
                $bad = @()
                foreach ($v in $vsixes) {
                  $zip = [IO.Compression.ZipFile]::OpenRead($v.FullName)
                  try {
                    $entry = $zip.Entries | Where-Object { $_.FullName -match 'extension\.vsixmanifest$' } | Select-Object -First 1
                    if (-not $entry) { throw "$($v.Name) has no extension.vsixmanifest" }
                    $reader = New-Object IO.StreamReader($entry.Open())
                    $xml = [xml]$reader.ReadToEnd(); $reader.Close()
                    $ver = $xml.PackageManifest.Metadata.Identity.Version
                    Write-Host "VSIX-VERSION $($v.Name) : $ver"
                    $rev = ($ver -split '\.')[-1]
                    if ($ver -match '2099123199' -or $ver -match '42\.42\.42') { $bad += "$($v.Name) = $ver (sentinel)" }
                    elseif ($rev -notmatch '^\d{10,}$')                        { $bad += "$($v.Name) = $ver (revision '$rev' is not <yyyyMMdd><2-digit rev>; an unpadded revision breaks upgrade ordering)" }
                    elseif ([int]$rev.Substring(0,4) -gt ([int](Get-Date -Format yyyy) + 1)) { $bad += "$($v.Name) = $ver (dated in the future)" }
                  } finally { $zip.Dispose() }
                }
                if ($bad.Count -gt 0) { throw "VSIX manifest version is a placeholder or implausible: $($bad -join '; '). A VSIX version sorts above every real build and VS's upgrade rules compare it, so this artifact could never be superseded. Fix -BuildNumber on the Package step; do not publish this." }
                Write-Host "VSIX-VERSION all $($vsixes.Count) vsix carry a plausible dated version"
              displayName: Assert VSIX version is not a placeholder

            # Copy-PackageIntoStaticDirectory populates the local NuGet feed the test assets
            # restore from. test\TestAssets\NuGet.config:8 declares
            #
            #   <add key="locally-built-testplatform-packages" value="..\..\artifacts\testArtifacts\packages"/>
            #
            # and nothing else in the build creates that directory. Its absence is what failed
            # build 3063938: 292 occurrences of
            #
            #   NU1301: The local source '...\artifacts\testArtifacts\packages' doesn't exist.
            #
            # The action was excluded by the -Actions selector above, correctly, for as long as
            # there was no test leg to consume the feed. Adding the test leg made it required.
            # Its source, artifacts\<config>\packages, is the same literal this pipeline already
            # reads at the artifact publish and the feed push, both of which succeeded on the
            # delivering build 3063087 - so the path survived the move to Arcade, measured rather
            # than assumed. Its Copy-Item produces the packages\ subdirectory the config names,
            # verified against the trailing-separator semantics rather than reasoned about.
            #
            # ASSERTED HERE, at the step responsible, because a feed that is missing or empty is
            # not an error at the point it is created - it surfaces hundreds of restore failures
            # in a later step and looks like a test-asset problem. Assert the product, not the
            # exit code: the action's product is nupkgs on disk at the path the config names.
            - pwsh: |
                $feed = "$(Build.SourcesDirectory)\artifacts\testArtifacts\packages"
                if (-not (Test-Path $feed)) {
                  Write-Host "##vso[task.logissue type=error]Local test feed was not created: $feed"
                  Write-Host "Copy-PackageIntoStaticDirectory did not produce its output. The test assets cannot restore."
                  exit 1
                }
                $nupkgs = @(Get-ChildItem $feed -Filter *.nupkg -File)
                Write-Host "Local test feed: $feed"
                Write-Host "  nupkgs: $($nupkgs.Count)"
                $nupkgs | Sort-Object Name | ForEach-Object { Write-Host "    $($_.Name)" }
                if ($nupkgs.Count -eq 0) {
                  Write-Host "##vso[task.logissue type=error]Local test feed exists but is empty: $feed"
                  exit 1
                }
              name: AssertLocalTestFeed
              displayName: Assert local test feed is populated

            # Signing is a separate Arcade invocation because it has to happen after packaging, and
            # packaging is not part of the Arcade build graph on this line.
            #
            # -restore is required and is not redundant with the restore above. Arcade's Tools.proj
            # carries "<ProjectReference Include="Sign.proj" Condition="'$(Sign)' == 'true'" />", so
            # Sign.proj is only restored by an invocation that already knows it is signing. Dropping
            # -restore here fails to resolve Microsoft.DotNet.SignTool.
            #
            # -build is absent on purpose. This invocation must not compile anything: see the note
            # on _OfficialBuildIdArgs above for why the build and the signing run carry different
            # properties.
            #
            # What proves this step did something is not its exit code. eng\Signing.props joins the
            # resolved ItemsToSign against the set Create-NugetPackages recorded, by name, and fails
            # on a difference in either direction; the log line "Signing set verified against the
            # produced set, by name: ..." is the evidence, and it names every package.
            # THE TEST ASSETS. Two invocations, not one, and nothing else builds them.
            #
            # Ported from 15.9's step (their azure-pipelines-official.yml:187) together with their
            # reasoning, which is the part worth having: the assets are a separate solution, the
            # Arcade port dropped the step that scripts\build.ps1 performed, and every test calling
            # IntegrationTestEnvironment.GetTestAsset then fails in CI with
            #
            #   Assert.IsTrue failed. GetTestAsset: Path not found:
            #   test\TestAssets\SimpleTestProject\bin\Release\net451\SimpleTestProject.dll
            #
            # Only 4 asset projects are members of TestPlatform.sln, so the Build step above cannot
            # cover the rest. Measured here on build 3063908: 6 failures of exactly that shape.
            #
            # Built with dotnet build rather than through Arcade, matching the original script.
            # test\TestAssets carries its own Directory.Build.props and .targets which deliberately
            # stop MSBuild searching upward, so these are NOT Arcade projects and must not be handed
            # to eng\common\build.ps1. -projects therefore does not apply: dotnet build is given an
            # explicit solution and cannot glob the repo root, which is the hazard -projects exists
            # to prevent in the Arcade invocations.
            #
            # TWO invocations because CILProject is NOT a member of TestAssets.sln - scripts\build.ps1
            # builds it separately at L415 and the solution at L431. 15.9's single step would leave it
